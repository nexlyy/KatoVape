<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Откуда панели вообще можно грузить код и куда стучаться. Pages свои заголовки ставить не
     даёт, поэтому политика идёт метой: браузер всё равно её применяет ко всему, кроме
     frame-ancestors (этот случай закрывает проверка ниже по файлу). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' https://telegram.org https://esm.sh;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com data:;
  img-src 'self' data: https:;
  connect-src 'self' https://esm.sh https://vffqnydxofvunwausakv.supabase.co https://telegram.org https://oauth.telegram.org;
  frame-src https://oauth.telegram.org https://telegram.org;
  form-action 'none';
  base-uri 'none'">
<title>KatoVape · управление</title>
<link rel="icon" type="image/png" href="../../data/photos/cat.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --surface:#121821; --surface-2:#171f29; --field:#0e141b;
  --line:#212b36; --line-2:#2e3b48;
  --ink:#e9eff4; --ink-2:#b3c0cc; --muted:#7f8d9a;
  --accent:#5ff3d0; --accent-ink:#04120e; --accent-dim:rgba(95,243,208,.13);
  --ok:#4ade80; --warn:#f5b83d; --danger:#fb7185; --info:#67d9f5;
  --r:10px; --r-lg:14px;
  --z-nav:20; --z-bar:60; --z-toast:80;
  --t:170ms cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- элементы управления ---- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--ink);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:13px;
  transition:background var(--t),border-color var(--t),color var(--t),opacity var(--t)}
.btn:hover{background:#1d2733;border-color:#3a4957}
.btn:active{background:#161e28}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#77f7d9;border-color:#77f7d9}
.btn.primary:active{background:#4ee0be}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
input,textarea{background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;width:100%;transition:border-color var(--t),background var(--t)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:hover,textarea:hover{border-color:var(--line-2)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:#101821}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
select{background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;
  transition:border-color var(--t)}
select:hover{border-color:var(--line-2)}
select:focus{outline:none;border-color:var(--accent)}

/* ---- вход ---- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(380px,100%)}
.auth-mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-mark img{width:34px;height:34px;border-radius:9px}
.auth-mark b{font-size:16px;font-weight:600;display:block;line-height:1.2}
.auth-mark span{display:block;color:var(--muted);font-size:13px}
.auth h1{font-size:19px;font-weight:600;margin-bottom:6px}
.auth p.lead{color:var(--muted);font-size:13px;margin-bottom:20px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .btn.primary{justify-content:center;padding:11px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 14px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.tgwrap{display:flex;justify-content:center;min-height:40px}
.btn.tg{width:100%;background:#2aabee;border-color:#2aabee;color:#fff;font-weight:600}
.btn.tg:hover{filter:brightness(1.06)}
.msg{border-radius:var(--r);padding:9px 12px;font-size:12.5px;line-height:1.45;margin-top:12px}
.msg.err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#ffa7b5}

/* ---- каркас ---- */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100dvh}
@media(max-width:820px){.shell{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;z-index:var(--z-nav)}
@media(max-width:820px){.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
@media(max-width:820px){.nav{flex-direction:row;overflow-x:auto;flex:none;padding:0 10px 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;color:var(--ink-2);
  padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:background var(--t),color var(--t)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--surface-2);border-radius:99px;padding:1px 7px}
.nav button.on .count{background:rgba(4,18,14,.25);color:var(--accent)}
@media(max-width:820px){.nav .count{margin-left:6px}}
.who{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
@media(max-width:820px){.who{display:none}}
.who-ava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
.who-ava img{width:100%;height:100%;object-fit:cover}
.who-name{flex:1;min-width:0}
.who-name b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-name span{font-size:11px;color:var(--muted)}
/* ссылка на инструкцию: тише разделов, но всегда на виду в боковой колонке */
.guide-link{display:block;margin:6px 10px 10px;padding:8px 11px;border-radius:9px;font-size:12.5px;
  color:var(--muted);border:1px dashed var(--line-2);transition:color var(--t),border-color var(--t)}
.guide-link:hover{color:var(--accent);border-color:var(--accent)}
.admlang{display:flex;gap:4px;padding:0 14px 10px}
.admlang button{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
.admlang button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
@media(max-width:820px){.admlang{padding:0 10px 10px}}

.main{min-width:0;padding:22px clamp(16px,3vw,28px) 96px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.head p{color:var(--muted);font-size:13px}

/* сводка одной плотной строкой, без витринных плиток */
.summary{display:flex;flex-wrap:wrap;gap:2px 26px;padding:14px 0 18px;margin-bottom:18px;
  border-bottom:1px solid var(--line)}
.summary div{display:flex;align-items:baseline;gap:7px}
.summary b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.summary span{font-size:12.5px;color:var(--muted)}
.summary div.hot b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.panel + .panel{margin-top:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:14px;font-weight:600}
.panel-body{padding:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:auto}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--t)}
tbody tr:hover{background:var(--surface-2)}
td .sub{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.new{background:rgba(245,184,61,.14);color:var(--warn)}
.pill.ok{background:rgba(74,222,128,.13);color:var(--ok)}
.pill.live{background:var(--accent-dim);color:var(--accent)}
.pill.off{background:var(--surface-2);color:var(--muted)}

.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:5px}
.skeleton{padding:16px;display:flex;flex-direction:column;gap:9px}
.skeleton i{display:block;height:13px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),#1f2937,var(--surface-2));
  background-size:200% 100%;animation:sk 1.1s linear infinite}
.skeleton i:nth-child(2){width:78%}.skeleton i:nth-child(3){width:88%}.skeleton i:nth-child(4){width:64%}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---- ассортимент ---- */
.item{border-bottom:1px solid var(--line);padding:14px 16px}
.item:last-of-type{border-bottom:none}
.item-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-top input{width:auto}
.i-name{flex:2;min-width:150px}.i-brand{flex:1;min-width:110px}.i-cat{flex:1;min-width:115px}
/* ступеням хватало 58px, пока цены были целыми: «45,50» уже не помещалось */
.i-nic{width:100px}.i-price{width:92px}.i-tier{width:68px}
.item-id{font-size:11.5px;color:var(--muted);margin:7px 0 2px;font-variant-numeric:tabular-nums}
.flavs{display:flex;flex-direction:column}
.flav{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.flav-n{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.flav input{width:76px;text-align:center}
.flav .unit{font-size:12px;color:var(--muted)}
.add-flav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add-flav input{width:auto}
.dirty input{border-color:var(--accent)}

/* ---- карточка вкуса: цвет, профиль, описание ---- */
.tint-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid var(--line-2)}
.fl-open{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fl-open em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fl-open.primary em{color:var(--accent-ink);opacity:.7}
.fl-slot:empty{display:none}
.fl-edit{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-lg);
  padding:14px;margin:2px 0 10px}
.fl-cols{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px}
.fl-col{min-width:0}
.fl-h{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-bottom:9px}

/* палитра: квадрат насыщенность-светлота и полоса тона */
.tint-pick{display:flex;flex-direction:column;gap:9px}
.tint-sv{position:relative;height:120px;border-radius:var(--r);cursor:crosshair;
  border:1px solid var(--line-2);touch-action:none}
.tint-hue{position:relative;height:14px;border-radius:99px;cursor:pointer;touch-action:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.tint-dot-sv,.tint-dot-hue{position:absolute;width:13px;height:13px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,50%)}
.tint-dot-hue{top:50%;transform:translate(-50%,-50%)}
.tint-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tint-sw{width:24px;height:24px;border-radius:7px;border:1px solid var(--line-2);cursor:pointer}
.tint-sw:hover{transform:scale(1.12)}
.tint-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.tint-prev{width:30px;height:30px;border-radius:8px;flex-shrink:0;border:1px solid var(--line-2)}
.tint-hex{width:104px;font-variant-numeric:tabular-nums;text-transform:uppercase}
.fl-edit.bad .tint-hex{border-color:var(--danger)}
.fl-edit.tint-off .tint-pick{opacity:.5}

/* вкусовой профиль */
.ts-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.ts-row > span{width:78px;flex-shrink:0;color:var(--ink-2)}
.ts-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ts-row input[type=range]:disabled{opacity:.4}
.ts-row b{width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* описания */
.fl-desc{margin-top:16px}
.fl-langs{display:flex;gap:6px;margin-bottom:8px}
.fl-ta{width:100%;background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;resize:vertical;line-height:1.5}
.fl-ta:focus{outline:none;border-color:var(--accent)}
.fl-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}

/* панель несохранённых изменений */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bar);background:var(--surface);
  border-top:1px solid var(--line-2);padding:12px clamp(16px,3vw,28px);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 -12px 32px -18px rgba(0,0,0,.9);
  transform:translateY(110%);transition:transform var(--t)}
.savebar.show{transform:none}
.savebar b{font-size:13.5px;font-weight:600}
.savebar span{color:var(--muted);font-size:12.5px}
.savebar .grow{flex:1}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .savebar{transition:none}
}

.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pform-wide{grid-column:1 / -1}
/* Строка «подпись и значение». Класс использовался в карточке менеджера, у поставщиков, в
   метках и в карточке клиента, но правила у него не было вовсе: подпись и значение стояли
   вплотную и читались как «Рольменеджер». */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;
  border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow > :first-child{flex:1;min-width:0;color:var(--ink-2)}
.prow .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
/* Сведения о человеке: подпись с двоеточием, значение сразу за ней, каждая пара своей строкой. */
.irow{display:flex;align-items:baseline;gap:7px;padding:5px 0;font-size:13px;flex-wrap:wrap}
.irow > b{color:var(--muted);font-weight:600}
/* полоса выгрузки отчёта под цифрами дашборда */
.exp-bar{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.exp-t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.irow > span{color:var(--ink)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:4px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-t{font-size:11.5px;font-weight:700}
.dash-g{margin-top:18px}
.dash-g-t{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.kpis-hero .kpi{background:var(--surface-2);border-color:var(--accent)}
.kpis-hero .kpi-v{font-size:26px}
.fold{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.fold>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:14px;list-style:none;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";display:inline-block;margin-right:9px;color:var(--muted);transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{background:var(--surface-2)}
.fold .panel{margin:0 12px 12px;border:none;background:none}
@media(max-width:700px){.dash-g-t{font-size:12px}.kpis-hero .kpi-v{font-size:22px}}
.kpi-t.up{color:var(--ok)}.kpi-t.down{color:var(--danger)}.kpi-t.flat{color:var(--muted)}
.dash-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.dash-none{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.chart{width:100%;height:170px;display:block;overflow:visible}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-area{fill:var(--accent-dim);stroke:none}
.chart circle{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .grid-t{fill:var(--muted);font-size:9px;vector-effect:non-scaling-stroke}
.chart-bar{fill:var(--accent)}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{background:var(--field);border-radius:99px;height:8px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-v{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:140px;height:140px;flex-shrink:0;transform:rotate(-90deg)}
.donut .ring{fill:none;stroke-width:16}
.donut-legend{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:0}
.donut-legend li{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.donut-legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
@media(max-width:640px){.kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .bar-row{grid-template-columns:minmax(70px,1fr) 1.4fr auto}}
.promo-tag{color:var(--accent)}
.i-hit{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.i-hit input{width:auto;margin:0}
.bcphoto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.bcpreview{display:block;max-width:220px;max-height:150px;object-fit:cover;border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.bcpreview[hidden]{display:none}

/* ================= телефон: свой формат панели =================
   Разделы прячем за бургер, шапка липкая сверху, таблицы становятся карточками.
   Всё, что нажимают пальцем, не ниже 44px. */
.mtop{display:none}
.mscrim{display:none}

@media(max-width:700px){
  .mtop{position:sticky;top:0;z-index:calc(var(--z-nav) + 2);display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mburger{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;
    border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--surface-2)}
  .mtitle{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mlang{display:flex;gap:4px;padding:0;width:auto;flex:0 0 auto}
  .mlang button{min-width:40px;height:34px;border-radius:9px}

  .mscrim{display:block;position:fixed;inset:0;z-index:var(--z-nav);background:rgba(0,0,0,.5)}
  .mscrim[hidden]{display:none}

  .shell{grid-template-columns:1fr}
  /* меню-ящик выезжает слева и закрывается по выбору раздела или тапу по затемнению */
  .side{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);height:100dvh;z-index:calc(var(--z-nav) + 1);
    border-right:1px solid var(--line);background:var(--surface);
    transform:translateX(-102%);transition:transform var(--t);overflow-y:auto}
  body.menu-open .side{transform:none}
  .brand{padding:16px 16px 12px}
  .nav{flex-direction:column;padding:6px 10px;gap:2px;flex:1;overflow:visible}
  .nav button{width:100%;flex-direction:row;justify-content:flex-start;gap:10px;
    min-height:46px;padding:10px 12px;font-size:14px;border-radius:10px}
  .nav .count{margin-left:auto}
  .side .admlang{display:none}      /* язык живёт в верхней шапке */
  .who{display:flex}

  .main{padding:14px 12px 96px}
  .head h1{font-size:18px}
  .head p{font-size:12.5px;line-height:1.45}
  .summary{gap:6px 16px;padding:10px 0 12px;margin-bottom:12px}
  .panel-head,.panel-body{padding:12px}
  .tools{gap:8px}
  .tools input,.tools select,.tools textarea{width:100%;min-height:44px}
  .tools .btn{flex:1 0 46%;justify-content:center;min-height:44px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:8px 12px;font-size:12.5px}
  input,select,textarea{font-size:16px;min-height:44px}   /* 16px не даёт iOS зумить поле */

  /* таблица в узком экране читается только карточками */
  table,thead,tbody,tr,th,td{display:block}
  thead{display:none}
  .scroll{overflow:visible}
  tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface-2);overflow:hidden}
  td{border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
  td:last-child{border-bottom:none}
  td::before{content:attr(data-l);flex:0 0 38%;max-width:38%;color:var(--muted);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding-top:3px}
  td:empty{display:none}
  td .tools{width:100%}
  td .btn.sm{flex:1}

  .item{padding:12px}
  .item-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .item-top input{width:100%}
  .i-name,.item-top .btn.danger,.i-hit{grid-column:1 / -1}
  .i-nic,.i-price,.i-tier{width:100%}
  .item-top .btn.danger{justify-content:center}
  /* в строке вкуса появилась кнопка настройки, на телефоне строка переносится */
  .flav{gap:8px;padding:10px 0;flex-wrap:wrap}
  .flav input{width:72px}
  .add-flav input{flex:1 0 100%}
  .add-flav .btn{flex:1}
  /* палитра и профиль встают друг под друга: рядом им тесно */
  .fl-cols{grid-template-columns:1fr;gap:18px}
  .fl-edit{padding:12px}
  .pform{grid-template-columns:1fr;gap:12px}

  /* полоса сохранения: у неё своя строка кнопок, поверх контента, но не поверх меню */
  .savebar{bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:var(--z-bar)}
  .savebar b{width:100%;font-size:12.5px}
  .savebar span{display:none}
  .savebar .btn{flex:1;justify-content:center}
  .toast{bottom:104px}
}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:var(--z-toast);
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;
  padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#2a0710}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:9px}
</style>
</head>

// Панель в чужой рамке. У менеджера тут кнопки, которые меняют статус заказа и отзывают
// доступ, а вошедшую сессию можно обмануть кликом по невидимому фрейму. Правило
// frame-ancestors браузер из меты не читает, а свои заголовки Pages ставить не даёт, поэтому
// проверяем сами. Telegram открывает мини-апп именно во фрейме, так что его домены остаются.
(function guardFrame() {
  if (window.top === window.self) return;
  let host = '';
  try {
    const anc = location.ancestorOrigins;
    host = new URL(anc && anc.length ? anc[anc.length - 1] : document.referrer).hostname;
  } catch (e) { host = ''; }
  if (/(^|\.)telegram\.org$/.test(host) || /(^|\.)t\.me$/.test(host)) return;
  document.documentElement.innerHTML =
    '<body style="font:16px system-ui;padding:40px;background:#0b0f14;color:#e6edf3">' +
    esc(L('Панель управления не открывается внутри чужой страницы.')) +
    ' <a style="color:#5ff3d0" href="' + esc(location.href) + '" target="_blank" rel="noopener">' +
    esc(L('Открыть отдельно')) + '</a></body>';
  throw new Error('framed');
})();

function authView(errText) {
  app.innerHTML = `
    <div class="auth"><div class="auth-box">
      <div class="auth-mark"><img src="../../data/photos/cat.png" alt=""><div>
        <b>KatoVape</b><span>${L('панель управления')}</span></div></div>
      <h1>${L('Вход для менеджеров')}</h1>
      <p class="lead">${L('Войдите аккаунтом магазина или через Telegram. Доступ открыт только тем, кому его выдали.')}</p>
      <form id="pwform">
        <label class="f">${L('Логин, почта или телефон')}
          <input id="ident" autocomplete="username" placeholder="manager"></label>
        <label class="f">${L('Пароль')}
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
        <button class="btn primary" type="submit" id="pwgo">${L('Войти')}</button>
      </form>
      <div class="sep">${L('или')}</div>
      <div class="tgwrap" id="tgwrap"></div>
      <div class="msg err" id="err" ${errText ? '' : 'hidden'}>${errText ? esc(errText) : ''}</div>
    </div></div>`;

  document.getElementById('pwform').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('pwgo');
    const ident = document.getElementById('ident').value.trim();
    const pw = document.getElementById('pw').value;
    if (!ident || !pw) return showErr(L('Заполните оба поля'));
    btn.disabled = true; btn.textContent = L('Проверяем…');
    try {
      // логин разрешает и пароль проверяет сервер, наружу почта менеджера не уходит
      const res = await fetch(CFG.FUNCTIONS_URL.replace(/\/$/, '') + '/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY },
        body: JSON.stringify({ identifier: ident, password: pw })
      });
      const out = await res.json().catch(() => ({}));
      if (out.error === 'tooMany') throw new Error(L('Слишком много попыток. Подождите четверть часа.'));
      if (!res.ok || !out.access_token) throw new Error(L('Неверный логин или пароль'));
      const { error } = await sb.auth.setSession({ access_token: out.access_token, refresh_token: out.refresh_token });
      if (error) throw error;
      await afterLogin();
    } catch (e2) {
      btn.disabled = false; btn.textContent = L('Войти');
      showErr(e2.message || L('Не вышло войти'));
    }
  };

  // Вход через Telegram идёт прямо на его страницу авторизации, без виджета. Виджет строит
  // кнопку только когда страница подключает его скрипт так, как написано в его же сниппете;
  // вставленный из кода, он оставлял пустое место. Здесь та же авторизация, но своей кнопкой:
  // Telegram возвращает подписанные данные в адресной строке, подпись проверяет функция
  // telegram-auth тем же способом, что и раньше.
  if (CFG.TELEGRAM_BOT_ID) {
    const wrap = document.getElementById('tgwrap');
    wrap.innerHTML = `<button class="btn tg" id="tglogin">${L('Войти через Telegram')}</button>`;
    document.getElementById('tglogin').onclick = () => {
      const ret = location.origin + location.pathname;
      location.href = 'https://oauth.telegram.org/auth?bot_id=' + encodeURIComponent(CFG.TELEGRAM_BOT_ID) +
        '&origin=' + encodeURIComponent(location.origin) +
        '&request_access=write&return_to=' + encodeURIComponent(ret);
    };
  }
}
function showErr(text) {
  const box = document.getElementById('err');
  if (!box) return;
  box.textContent = text; box.hidden = false;
}

async function exchangeTg(body) {
  const res = await fetch(CFG.FUNCTIONS_URL.replace(/\/$/, '') + '/telegram-auth', {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.email || !out.otp) throw new Error(out.error || L('не удалось войти'));
  const { error } = await sb.auth.verifyOtp({ email: out.email, token: out.otp, type: 'magiclink' });
  if (error) throw error;
}
window.onTgAuth = async u => {
  try { await exchangeTg({ mode: 'widget', payload: u }); await afterLogin(); }
  catch (e) { authView(e.message || L('ошибка входа')); }
};
// панель открыта из бота как мини-апп: initData уже подписан, вход идёт сам
async function tgInitLogin() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return false;
  try { await exchangeTg({ mode: 'initdata', initData: tg.initData }); await afterLogin(); return true; }
  catch (e) { return false; }
}

async function afterLogin() {
  const { data: { user } } = await sb.auth.getUser();
  const { data: ov, error } = await sb.rpc('admin_overview');
  if (error || !ov) {
    await sb.auth.signOut();
    return authView(L('У этого аккаунта нет доступа в панель. Попросите владельца выдать его во вкладке «Доступ».'));
  }
  me = user; overview = ov;
  const { data: p } = await sb.from('profiles').select('display_name, username, avatar').eq('id', user.id).maybeSingle();
  profile = p || null;
  shell();
}

  document.getElementById('sb-reset').onclick = () => { clearDirty(); render(); };
  document.getElementById('sb-apply').onclick = saveProducts;
  render();
}

function loading() {
  return '<div class="panel"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div>';
}
function empty(title, text) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`;
}
function panel(title, body, tools) {
  return `<div class="panel"><div class="panel-head"><h2>${esc(title)}</h2>
    ${tools ? `<div class="tools">${tools}</div>` : ''}</div>${body}</div>`;
}
function table(head, rows) {
  if (!rows.length) return '';
  // data-l дублирует заголовок столбца: на телефоне строка превращается в карточку,
  // и подпись показывается слева от значения (шапка таблицы там скрыта)
  return `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td data-l="${esc(String(head[i] || '').replace(/<[^>]*>/g, ''))}">${c == null ? '' : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// статусы: русский текст в словаре, перевод накладываем при выводе через L() в pill()
// packed и shipped завела миграция 0032, их пока никто не проставляет, но список статусов
// в базе их допускает, и сырое слово в таблице выглядело бы ошибкой
const ST = { new: ['новый', 'ok'], confirmed: ['в обработке', 'warn'], packed: ['собран', 'ok'],
  shipped: ['отправлен', 'ok'], done: ['выдан', 'ok'],
  cancelled: ['отменён', 'off'], active: ['активна', 'live'], notified: ['напомнили', 'live'],
  expired: ['истекла', 'off'], waiting: ['ждёт', 'new'] };

// Порядок работы с заказом. Самовывоз не отправляют, поэтому «отправлен» появляется только
// у доставки. Владелец хочет видеть, сколько заказ пролежал нетронутым, отсюда SLA_MIN.
const SLA_MIN = 60;
const FLOW_NEXT = {
  new:       [['confirmed', 'В обработку']],
  confirmed: [['packed', 'Собран']],
  packed:    [['shipped', 'Отправлен'], ['done', 'Выдан']],
  shipped:   [['done', 'Выдан']]
};
const CAN_CANCEL = ['new', 'confirmed', 'packed', 'shipped'];
// сколько минут заказ ждёт первого действия менеджера
const waitingMin = o => o.status !== 'new' ? 0
  : Math.floor((Date.now() - new Date(o.created_at).getTime()) / 60000);
// Подписи статуса и оплаты берут словарь: в диаграммах раньше показывались сырые ключи
// из базы вроде «done» и «unpaid».
const PAY_ST = { paid: 'оплачен', pending: 'ждёт оплаты', unpaid: 'при выдаче', failed: 'оплата не прошла' };
const stName  = s => L((ST[s] || [s])[0]);
const payName = s => L(PAY_ST[s] || s);
const pill = s => { const x = ST[s] || [s, '']; return `<span class="pill ${x[1]}">${esc(L(x[0]))}</span>`; };

function itemsStr(items) {
  return (items || []).map(i => typeof i === 'string' ? i
    : (i.name || i.id) + (i.flavor ? ' · ' + i.flavor : '') + ' ×' + (i.n || 1)).join(', ');
}

    // Статус ставится из списка, а не цепочкой подтверждений: менеджер видит, где заказ,

// для неё отдельная кнопка, иначе причина потерялась бы.
const STATUS_FLOW = ['new', 'confirmed', 'packed', 'shipped', 'done'];
function statusSelect(o) {
  const opts = STATUS_FLOW
    .filter(st => st !== 'shipped' || o.delivery !== 'pickup')
    .map(st => `<option value="${st}" ${st === o.status ? 'selected' : ''}>${esc(L(ST[st][0]))}</option>`).join('');
  const cancelled = o.status === 'cancelled'
    ? `<option value="cancelled" selected>${esc(L(ST.cancelled[0]))}</option>` : '';
  return `<select class="ost-sel pill-${ST[o.status] ? ST[o.status][1] : ''}" data-osel="${o.id}" style="width:auto">${cancelled}${opts}</select>` +
    (o.status !== 'cancelled' ? `<button class="btn sm danger" data-ost="cancelled" data-id="${o.id}">${L('Отказ')}</button>` : '');
}

function btn(kind, id, st, label, cls) {
  return `<button class="btn sm ${cls || ''}" data-${kind}="${st}" data-id="${id}">${label}</button>`;
}
// Причины отказа держит база: владелец правит список, отчёт «почему теряем заказы» строится
// по нему. Без причины отменить заказ нельзя, это правило crm_set_status.
let cancelReasons = [];
async function loadCancelReasons() {
  if (cancelReasons.length) return cancelReasons;
  const { data } = await sb.from('cancel_reasons').select('*').eq('active', true).order('id');
  cancelReasons = data || [];
  return cancelReasons;
}
async function askCancel(btnEl, orderId) {
  const box = btnEl.closest('.tools');
  if (!box) return;
  const reasons = await loadCancelReasons();
  box.innerHTML =
    `<select class="rsn" style="width:auto">${reasons.map(r =>
      `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>` +
    `<button class="btn sm danger rsn-go">${L('Отказ')}</button>` +
    `<button class="btn sm quiet rsn-no">${L('Отмена')}</button>`;
  box.querySelector('.rsn-no').onclick = () => render();
  box.querySelector('.rsn-go').onclick = async () => {
    const reason = +box.querySelector('.rsn').value;
    const { error } = await sb.rpc('crm_set_status', { p_order: orderId, p_status: 'cancelled', p_reason: reason });
    if (error) return toast(error.message, true);
    toast(L('Статус обновлён'));
    await refreshOverview();
    render();
  };
}
function bindStatusSelect(m) {
  m.querySelectorAll('[data-osel]').forEach(sel => sel.onchange = async () => {
    const id = +sel.dataset.osel, to = sel.value;
    sel.disabled = true;
    const { error } = await sb.rpc('crm_set_status', { p_order: id, p_status: to, p_reason: null });
    sel.disabled = false;
    if (error) { toast(error.message, true); return render(); }
    toast(L('Статус обновлён'));
    await refreshOverview();
    render();
  });
}
function bindStatus(m, kind, tableName) {
  m.querySelectorAll('[data-' + kind + ']').forEach(b => b.onclick = async () => {
    const to = b.dataset[kind === 'ost' ? 'ost' : 'rst'];
    // Отмена заказа обязана нести причину, поэтому сначала спрашиваем её
    if (tableName === 'orders' && to === 'cancelled') return askCancel(b, +b.dataset.id);
    b.disabled = true;
    if (tableName === 'orders') {
      // через crm_set_status: он проверяет город и пишет в журнал действий
      const { error } = await sb.rpc('crm_set_status', { p_order: +b.dataset.id, p_status: to, p_reason: null });
      if (error) { b.disabled = false; return toast(error.message, true); }
      toast(L('Статус обновлён'));
      await refreshOverview();
      return render();
    }
    const patch = { status: to };
    // select() возвращает изменённые строки: если RLS не пустила (чужой город), их будет ноль,
    // и молчаливого «обновлено» быть не должно
    const { data, error } = await sb.from(tableName).update(patch).eq('id', +b.dataset.id).select('id');
    if (error) { b.disabled = false; return toast(error.message, true); }
    if (!data || !data.length) { b.disabled = false; return toast(L('Строка недоступна для изменения'), true); }
    toast(L('Статус обновлён'));
    await refreshOverview();
    render();
  });
}

// Массовый ввод поставки.
//
// Первая настоящая поставка это сотня строк, и по одной через форму их никто вбивать не
// станет. Список вставляется целиком из таблицы, а панель сверяет его с каталогом города
// ДО того, как строки уйдут в документ. Сверка тут не для красоты: проведение заводит
// новый товар, если строка не нашлась, поэтому опечатка во вкусе тихо создала бы
// фантомную позицию с остатком и без цены, и вылезла бы она уже на витрине.
const SUP_SEP = /[\t;|]/;
// Число из ячейки таблицы: запятая как разделитель дробной части, пробелы-разделители
// тысяч, хвост вроде «zł».
// Минус оставляем намеренно: «-5» должно уйти в ошибку как отрицательное количество, а не
// молча превратиться в пятёрку.
const supNum = v => {
  const s = String(v == null ? '' : v).replace(',', '.').replace(/[^\d.-]/g, '');
  return s === '' ? NaN : Number(s);
};

function parseSupplyBulk(text, catalogue) {
  const known = new Set();
  const flavorsOf = new Map();
  for (const p of catalogue || []) {
    const fl = p.flavor || '';
    known.add(p.id + '␀' + fl);
    if (!flavorsOf.has(p.id)) flavorsOf.set(p.id, []);
    flavorsOf.get(p.id).push(fl);
  }
  return String(text || '').split('\n').map(x => x.trim()).filter(Boolean).map((raw, i) => {
    const c = raw.split(SUP_SEP).map(x => x.trim());
    const row = { n: i + 1, raw };
    if (c.length < 3) { row.err = 'мало столбцов'; return row; }
    // три столбца это товар без вкусов: id, штук, закупка
    const [pid, flavor, qty, cost] = c.length === 3
      ? [c[0], '', c[1], c[2]] : [c[0], c[1], c[2], c[3]];
    row.id = pid; row.flavor = flavor;
    row.qty = Math.round(supNum(qty)); row.cost = supNum(cost);
    if (!pid) { row.err = 'нет id товара'; return row; }
    if (!Number.isFinite(row.qty) || row.qty <= 0) { row.err = 'не понял количество'; return row; }
    if (!Number.isFinite(row.cost) || row.cost < 0) { row.err = 'не понял закупочную цену'; return row; }
    if (known.has(pid + '␀' + flavor)) { row.ok = true; return row; }
    if (flavorsOf.has(pid)) {
      row.err = 'у этого товара нет такого вкуса';
      row.hint = flavorsOf.get(pid).filter(Boolean).join(', ');
      return row;
    }
    // Товара нет в городе вовсе: это не опечатка во вкусе, а новая позиция, и поставка
    // имеет право её завести. Но предупредить надо, иначе опечатка в id пройдёт молча.
    row.ok = true; row.warn = 'товара нет в городе, поставка заведёт новый';
    return row;
  });
}

// Проведение говорит с панелью кодами, а не фразами. Переводим их в человеческие, иначе
// менеджер видит «BAD_FLAVOR: hqd / Minr (Mint, Cola)» и идёт спрашивать, что это было.
function supplyErr(e) {
  const msg = (e && e.message) || String(e);
  const bad = /BAD_FLAVOR: (.*?) \/ (.*?) \(([^)]*)\)/.exec(msg);
  if (bad) {
    return L('Такого вкуса нет в ассортименте: ') + bad[1] + ' · ' + (bad[2] || L('без вкуса')) +
      (bad[3] ? '. ' + L('есть вкусы: ') + bad[3] : '') + '. ' +
      L('Исправьте строку или заведите вкус в разделе «Ассортимент».');
  }
  if (msg.includes('ALREADY_POSTED')) return L('Эта поставка уже проведена.');
  if (msg.includes('EMPTY_SUPPLY')) return L('В поставке нет ни одной позиции.');
  return msg;
}

        r.err ? `<span class="pill off">${esc(L(r.err))}</span>${
                  r.hint ? `<span class="sub">${esc(L('есть вкусы: '))}${esc(r.hint)}</span>` : ''}`

              : `<span class="pill ok">${esc(L('ок'))}</span>`])) +
      `<p class="hint">${L('Готово к добавлению: ')}<b>${good.length}</b>${
        rows.length - good.length ? ' · ' + L('с ошибками: ') + (rows.length - good.length) : ''
        } · ${L('на сумму')} <b>${money2(total)}</b></p>` +
      (good.length ? `<div class="tools"><button class="btn primary" id="l_badd">${
        L('Добавить строки')} (${good.length})</button></div>` : '');

    const badd = document.getElementById('l_badd');
    if (badd) badd.onclick = async () => {
      badd.disabled = true;
      const { error } = await sb.from('supply_lines').insert(good.map(r => ({
        supply_id: id, product_id: r.id, flavor: r.flavor, qty: r.qty, cost: r.cost })));
      badd.disabled = false;
      if (error) return toast(error.message, true);
      toast(L('Добавлено строк: ') + good.length);
      openSupply(id);
    };
  };
  const bclear = document.getElementById('l_bclear');
  if (bclear) bclear.onclick = () => {
    document.getElementById('l_bulk').value = '';
    document.getElementById('bulkres').innerHTML = '';
  };
  const post = document.getElementById('s_post');
  if (post) post.onclick = async () => {
    if (!confirm(L('Провести поставку? Остаток увеличится.'))) return;
    post.disabled = true;
    const { error } = await sb.rpc('supply_post', { p_id: id });
    post.disabled = false;
    if (error) return toast(supplyErr(error), true);
    toast(L('Поставка проведена'));
    render();
  };
}

/* ================= напоминания ================= */
// Задача с датой и временем: когда срок придёт, бот напишет менеджеру города или конкретному
// человеку. Заказ можно привязать, тогда в сообщении будет его номер.
const TASK_KINDS = [['call', 'Позвонить клиенту'], ['address', 'Уточнить адрес'],
                    ['follow_up', 'Связаться повторно'], ['custom', 'Другое']];
let tasksDone = false;

async function renderTasks(m) {
  const { data, error } = await sb.from('tasks').select('*')
    .eq('done', tasksDone).order('due_at', { ascending: true }).limit(200);
  if (error) return swap(m, panel(L('Ошибка'), `<div class="empty">${esc(error.message)}</div>`));
  const list = data || [];
  const kindName = k => L((TASK_KINDS.find(x => x[0] === k) || [0, k])[1]);
  const overdue = t => !t.done && new Date(t.due_at) < new Date();

  const rows = list.map(t => [
    esc(t.title) + (t.body ? `<span class="sub">${esc(t.body)}</span>` : ''),
    kindName(t.kind),
    `<span class="num">${fdate(t.due_at)}</span>` +
      (overdue(t) ? `<span class="pill warn">${L('просрочено')}</span>` : ''),
    t.order_id ? `<span class="num">#${t.order_id}</span>` : '—',
    esc(CITY_LABEL[t.city] || t.city),
    t.notified_at ? `<span class="pill ok">${L('отправлено')}</span>` : `<span class="pill new">${L('ждёт')}</span>`,
    (t.done ? '' : `<button class="btn sm primary" data-tdone="${t.id}">${L('Выполнено')}</button>`) +
      `<button class="btn sm danger" data-tdel="${t.id}">×</button>`
  ]);

  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString();
  swap(m, panel(tasksDone ? L('Выполненные') : L('Открытые напоминания'), rows.length
      ? table([L('Что сделать'), L('Тип'), L('Когда'), L('Заказ'), L('Город'), L('Бот'), ''], rows)
      : empty(L('Напоминаний нет'), L('Заведите первое формой ниже: бот сам напомнит в срок.')),
      `<button class="btn sm ${tasksDone ? '' : 'primary'}" id="t_open">${L('Открытые')}</button>
       <button class="btn sm ${tasksDone ? 'primary' : ''}" id="t_done">${L('Выполненные')}</button>`) +
    panel(L('Новое напоминание'), `<div class="panel-body">
      <div class="pform">
        <label class="f">${L('Что сделать')}<input id="t_title" maxlength="200" placeholder="${L('Позвонить клиенту')}"></label>
        <label class="f">${L('Тип')}<select id="t_kind">${TASK_KINDS.map(([v, n]) =>
          `<option value="${v}">${L(n)}</option>`).join('')}</select></label>
        <label class="f">${L('Дата')}<input type="date" id="t_date" value="${now.slice(0, 10)}"></label>
        <label class="f">${L('Время')}<input type="time" id="t_time" value="${now.slice(11, 16)}"></label>
        <label class="f">${L('Город')}<select id="t_city">${citiesAllowed().map(c =>
          `<option value="${c}">${CITY_LABEL[c]}</option>`).join('')}</select></label>
        <label class="f">${L('Заказ, если есть')}<input id="t_order" inputmode="numeric" placeholder="#"></label>
        <label class="f pform-wide">${L('Подробности')}<input id="t_body" maxlength="2000" placeholder="${L('Что важно помнить')}"></label>
      </div>
      <div class="tools" style="margin-top:12px"><button class="btn primary" id="t_add">${L('Поставить напоминание')}</button></div>
      <p class="hint">${L('Бот напишет менеджерам города в указанное время. Отдельно он сам напомнит про заказы, которые собраны, но не выданы до конца дня.')}</p>
    </div>`));

  document.getElementById('t_open').onclick = () => { tasksDone = false; render(); };
  document.getElementById('t_done').onclick = () => { tasksDone = true; render(); };
  m.querySelectorAll('[data-tdone]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('tasks').update({ done: true }).eq('id', +b.dataset.tdone);
    if (error) return toast(error.message, true);
    toast(L('Выполнено')); render();
  });
  m.querySelectorAll('[data-tdel]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('tasks').delete().eq('id', +b.dataset.tdel);
    if (error) return toast(error.message, true);
    render();
  });
  document.getElementById('t_add').onclick = async () => {
    const title = (document.getElementById('t_title').value || '').trim();
    if (!title) return toast(L('Впишите, что сделать'), true);
    const d = document.getElementById('t_date').value, t = document.getElementById('t_time').value;
    if (!d || !t) return toast(L('Укажите дату и время'), true);
    const orderRaw = (document.getElementById('t_order').value || '').replace('#', '').trim();
    const { error } = await sb.from('tasks').insert({
      city: document.getElementById('t_city').value,
      title, body: (document.getElementById('t_body').value || '').trim() || null,
      kind: document.getElementById('t_kind').value,
      due_at: new Date(d + 'T' + t).toISOString(),
      order_id: orderRaw ? Number(orderRaw) : null,
      created_by: me.id
    });
    if (error) return toast(error.message, true);
    toast(L('Напоминание поставлено')); render();
  };
}

/* ================= менеджеры ================= */
// Кто с каким городом работает, какой у него ассортимент и сколько он получает с продажи.
// Проценты задаются по категориям товара и берутся из справочника, а не из списка в коде:
// добавится категория, здесь сама появится строка.
let mgrQuery = '', mgrRole = '', mgrCity = '';

async function renderManagers(m) {
  const [{ data: access }, { data: rates }, { data: cats }, { data: prods }] = await Promise.all([
    sb.rpc('admin_access_list'),
    sb.from('manager_rates').select('*').order('from_date', { ascending: false }),
    sb.from('product_categories').select('*').eq('active', true).neq('id', '').order('sort'),
    sb.from('products').select('id,city,category')
  ]);
  const catList = cats || [];
  const catName = c => admLang === 'uk' ? c.name_uk : admLang === 'pl' ? c.name_pl : c.name_ru;

  // сколько позиций в городе менеджера и по каким категориям
  const byCity = {};
  for (const p of prods || []) {
    const c = (byCity[p.city] = byCity[p.city] || { total: 0, cats: {} });
    c.total++;
    if (p.category) c.cats[p.category] = (c.cats[p.category] || 0) + 1;
  }

  const q = mgrQuery.toLowerCase();
  const list = (access || []).filter(a =>
    (!q || (a.who || '').toLowerCase().includes(q) || String(a.ident).includes(q)) &&
    (!mgrRole || a.role === mgrRole) &&
    (!mgrCity || a.city === mgrCity));

  // действующая ставка: последняя по дате для этой пары менеджер+категория
  const rateOf = (tg, city, cat) => (rates || [])
    .filter(r => String(r.telegram_id) === String(tg) && r.city === city &&
                 r.category === cat)
    .sort((a, b) => (a.from_date < b.from_date ? 1 : -1))[0];
  // База начисления у менеджера в городе одна на все категории. Список открывался всегда на
  // «с прибыли», и сохранённое «со всей суммы» молча возвращалось к прежнему при первом же
  // изменении процента.
  const baseOf = (tg, city) => (((rates || [])
    .filter(r => String(r.telegram_id) === String(tg) && r.city === city)
    .sort((a, b) => (a.from_date < b.from_date ? 1 : -1))[0] || {}).base) || 'gross';

  const cards = list.map(a => {
    const city = a.city;
    const stock = city ? (byCity[city] || { total: 0, cats: {} }) : null;
    // Процент задаётся по категориям товара и только по ним. Строки «все остальные» больше
    // нет: у каждого товара в магазине категория проставлена, и общая ставка лишь путала,
    // потому что молча перекрывала пустые категории.
    const rows = city
      ? catList.map(c => ({ id: c.id, label: catName(c) }))
        .map(c => {
          const r = rateOf(a.ident, city, c.id);
          const n = stock.cats[c.id] || 0;
          return `<div class="prow"><span>${esc(c.label)}
              <span class="sub">${n} ${L('позиций')}</span></span>
            <input class="mr-pct" data-cat="${esc(c.id)}" data-tg="${esc(String(a.ident))}"
                   data-city="${esc(city)}" style="width:90px" inputmode="decimal"
                   value="${r ? r.percent : ''}" placeholder="%">
            <span class="sub">${r ? L('с') + ' ' + fday(r.from_date) : L('не задана')}</span></div>`;
        }).join('')
      : `<p class="dash-none">${L('У этой роли доступ ко всем городам, ставка не задаётся.')}</p>`;

    return panel(esc(a.who || String(a.ident)), `<div class="panel-body">
      <div class="irow"><b>${L('Роль')}:</b><span class="pill ${a.role === 'manager' ? '' : 'ok'}">${esc(L(ROLE_RU[a.role] || a.role))}</span></div>
      <div class="irow"><b>${L('Город')}:</b><span>${city ? esc(CITY_LABEL[city] || city) : L('все города')}</span></div>
      <div class="irow"><b>${L('Ассортимент')}:</b><span>${stock ? stock.total + ' ' + L('позиций') : '—'}</span></div>
      <div class="irow"><b>${L('Способ входа')}:</b><span>${a.kind === 'telegram' ? 'Telegram' : L('Пароль')}</span></div>
      ${city ? `<div class="prow"><span><b>${L('Процент с продажи')}</b></span>
        <select class="mr-base" data-tg="${esc(String(a.ident))}" data-city="${esc(city)}" style="width:auto">
          <option value="gross" ${baseOf(a.ident, city) === 'gross' ? 'selected' : ''}>${L('с прибыли')}</option>
          <option value="revenue" ${baseOf(a.ident, city) === 'revenue' ? 'selected' : ''}>${L('со всей суммы')}</option>
        </select></div>` : ''}
      ${rows}
      ${city ? `<div class="tools" style="margin-top:10px">
        <button class="btn primary mr-save" data-tg="${esc(String(a.ident))}" data-city="${esc(city)}">${L('Применить')}</button>
        <span class="hint" style="margin:0">${L('Новые проценты начнут действовать с сегодняшнего дня, прошлые заказы не пересчитываются.')}</span>
      </div>` : ''}
    </div>`);
  }).join('');

  swap(m, panel(L('Менеджеры'), `<div class="panel-body"><div class="tools">
      <input id="mq" placeholder="${L('Имя или Telegram ID')}" style="width:210px" value="${esc(mgrQuery)}">
      <select id="mrole" style="width:auto"><option value="">${L('все роли')}</option>
        ${ROLE_OPTS.map(r => `<option value="${r}" ${r === mgrRole ? 'selected' : ''}>${L(ROLE_RU[r])}</option>`).join('')}</select>
      <select id="mcity" style="width:auto"><option value="">${L('все города')}</option>
        ${CITIES.map(c => `<option value="${c}" ${c === mgrCity ? 'selected' : ''}>${CITY_LABEL[c]}</option>`).join('')}</select>
    </div>
    <p class="hint">${L('Показано')}: ${list.length}</p></div>`) +
    (cards || empty(L('Никого не нашлось'), L('Измените поиск или выдайте доступ во вкладке «Доступ».'))));

  const mq = document.getElementById('mq');
  if (mq) {
    mq.oninput = () => { clearTimeout(mq._t); mq._t = setTimeout(() => { mgrQuery = mq.value.trim(); render(); }, 400); };
    if (mgrQuery) { mq.focus(); mq.setSelectionRange(mq.value.length, mq.value.length); }
  }
  document.getElementById('mrole').onchange = e => { mgrRole = e.target.value; render(); };
  document.getElementById('mcity').onchange = e => { mgrCity = e.target.value; render(); };

  m.querySelectorAll('.mr-save').forEach(b => b.onclick = async () => {
    const tg = Number(b.dataset.tg), city = b.dataset.city;
    if (!Number.isFinite(tg)) return toast(L('Ставка задаётся тем, кто входит через Telegram'), true);
    const base = m.querySelector(`.mr-base[data-tg="${b.dataset.tg}"][data-city="${city}"]`).value;
    const today = new Date().toISOString().slice(0, 10);
    const rows = [];
    m.querySelectorAll(`.mr-pct[data-tg="${b.dataset.tg}"][data-city="${city}"]`).forEach(i => {
      const v = (i.value || '').trim();
      if (v === '') return;
      const pct = Number(v.replace(',', '.'));
      if (!Number.isFinite(pct) || pct < 0 || pct > 100) { rows.bad = true; return; }
      const cur = rateOf(tg, city, i.dataset.cat);
      // не плодим одинаковые строки: пишем только то, что реально изменилось
      if (cur && Number(cur.percent) === pct && cur.base === base) return;
      rows.push({ telegram_id: tg, city, category: i.dataset.cat || '', percent: pct, base, from_date: today });
    });
    if (rows.bad) return toast(L('Процент от 0 до 100'), true);
    if (!rows.length) return toast(L('Изменений нет'));
    b.disabled = true;
    const { error } = await sb.from('manager_rates').upsert(rows, { onConflict: 'telegram_id,city,category,from_date' });
    b.disabled = false;
    if (error) return toast(error.message, true);
    toast(L('Ставки сохранены'));
    render();
  });
}

/* ================= финансы ================= */
let finFrom = '', finTo = '';

// Доля продавца. Процент живёт в базе и правится тут, потому что он у каждого свой и время
// от времени меняется. Новая ставка не переписывает старую, а начинает действовать со своей
// даты: иначе отчёт за прошлый месяц завтра пересчитался бы и разошёлся с выплаченным.
function payoutsPanel(rep, rates, admins) {
  const pays = (rep && rep.payouts) || [];
  const who = tg => {
    const a = (admins || []).find(x => String(x.ident) === String(tg));
    return a ? a.who : String(tg);
  };
  const paid = pays.length
    ? table([L('Менеджер'), L('Город'), L('Ставка сейчас'), L('База'), L('Заказов'), L('Заработал')],
        pays.map(p => [esc(who(p.telegram_id)) + `<span class="sub">tg ${p.telegram_id}</span>`,
          esc(CITY_LABEL[p.city] || p.city),
          `<span class="num">${p.percent_now == null ? '—' : p.percent_now + ' %'}</span>` +
            `<span class="sub">${p.base_now === 'revenue' ? L('со всей суммы') : L('с прибыли')}${
              p.cat_rates ? ' · ' + L('своя ставка у категорий: ') + p.cat_rates : ''}</span>`,
          `<span class="num">${money(p.base_sum)}</span>`,
          `<span class="num">${p.orders}</span>`,
          `<span class="num">${money(p.payout)}</span>`]))
    : `<div class="panel-body"><p class="dash-none">${L('Ставки ещё не заданы')}</p></div>`;

  const hist = (rates || []).map(r => [
    esc(who(r.telegram_id)), esc(CITY_LABEL[r.city] || r.city),
    `<span class="num">${r.percent} %</span>`,
    r.base === 'revenue' ? L('со всей суммы') : L('с прибыли'),
    `<span class="num">${fday(r.from_date)}</span>`,
    esc(r.note || ''),
    `<button class="btn sm danger" data-ratedel="${r.id}">×</button>`]);

  return panel(L('Доля менеджеров за период'), paid) +
    panel(L('Ставки'), `<div class="panel-body">
      ${hist.length ? table([L('Менеджер'), L('Город'), L('Процент'), L('Считать'), L('Действует с'), L('Заметка'), ''], hist)
        : `<p class="dash-none">${L('Ставок пока нет')}</p>`}
      <div class="tools" style="margin-top:10px">
        <select id="r_tg" style="width:auto">${(admins || [])
          .filter(a => a.kind === 'telegram')
          .map(a => `<option value="${esc(a.ident)}">${esc(a.who)} (${esc(a.ident)})</option>`).join('')}</select>
        <select id="r_city" style="width:auto">${CITIES.map(c =>
          `<option value="${c}">${CITY_LABEL[c]}</option>`).join('')}</select>
        <input id="r_pct" placeholder="%" style="width:80px" inputmode="decimal">
        <select id="r_base" style="width:auto">
          <option value="gross">${L('с прибыли')}</option>
          <option value="revenue">${L('со всей суммы')}</option>
        </select>
        <input type="date" id="r_from" value="${new Date().toISOString().slice(0, 10)}">
        <input id="r_note" placeholder="${L('Заметка')}" style="width:150px">
        <button class="btn primary" id="r_add">${L('Задать ставку')}</button>
      </div>
      <p class="hint">${L('Прежняя ставка остаётся в истории: заказы до этой даты считаются по ней.')}</p>
    </div>`);
}
function bindRates(m) {
  const add = document.getElementById('r_add');
  if (add) add.onclick = async () => {
    const pct = Number((document.getElementById('r_pct').value || '').replace(',', '.'));
    if (!Number.isFinite(pct) || pct < 0 || pct > 100) return toast(L('Процент от 0 до 100'), true);
    const tg = document.getElementById('r_tg').value;
    if (!tg) return toast(L('Сначала выдайте менеджеру доступ по Telegram ID'), true);
    const { error } = await sb.from('manager_rates').insert({
      telegram_id: Number(tg), city: document.getElementById('r_city').value,
      percent: pct, base: document.getElementById('r_base').value,
      from_date: document.getElementById('r_from').value,
      note: (document.getElementById('r_note').value || '').trim() || null
    });
    if (error) return toast(error.code === '23505' ? L('На эту дату ставка уже задана') : error.message, true);
    toast(L('Ставка задана')); render();
  };
  m.querySelectorAll('[data-ratedel]').forEach(b => b.onclick = async () => {
    if (!confirm(L('Удалить ставку') + '?')) return;
    const { error } = await sb.from('manager_rates').delete().eq('id', +b.dataset.ratedel);
    if (error) return toast(error.message, true);
    render();
  });
}
async function renderFinance(m) {

    sb.rpc('fin_report', { p_from: finFrom, p_to: finTo }),
    sb.from('expense_categories').select('*').eq('active', true).order('id'),
    sb.from('expenses').select('*').gte('at', finFrom).lte('at', finTo).order('at', { ascending: false }).limit(100),
    sb.from('manager_rates').select('*').order('city').order('from_date', { ascending: false }),

  const sum = k => byCity.reduce((a, c) => a + Number(c[k] || 0), 0);

  swap(m, panel(L('Итог за период'), `<div class="panel-body">
      <div class="tools">
        <input type="date" id="f_from" value="${finFrom}">

        ${kpi(L('Валовая прибыль'), money(sum('gross')))}
        ${kpi(L('Доля менеджеров'), money(sum('payout')))}
        ${kpi(L('Расходы'), money(sum('expenses') + shared))}
        ${kpi(L('Списано'), money(sum('write_offs')))}
        ${kpi(L('Прибыль'), money(totalProfit))}
      </div>
      <p class="hint">${L('Доход это выданные заказы, наличные и карта вместе. Прибыль остаётся после доли продавца, закупки и расходов.')}</p>
    </div>`) +
    panel(L('По городам'), table(
      [L('Город'), L('Заказов'), L('Доход'), L('Себестоимость'), L('Валовая'), L('Менеджеру'), L('Расходы'), L('Списано'), L('Прибыль')],
      byCity.map(c => [esc(CITY_LABEL[c.city] || c.city), `<span class="num">${c.orders}</span>`,
        `<span class="num">${money(c.revenue)}</span>`, `<span class="num">${money(c.cogs)}</span>`,
        `<span class="num">${money(c.gross)}</span>`, `<span class="num">${money(c.payout)}</span>`,
        `<span class="num">${money(c.expenses)}</span>`,
        `<span class="num">${money(c.write_offs)}</span>`, `<span class="num">${money(c.profit)}</span>`])) +
      (shared ? `<p class="hint">${L('Общие расходы без города')}: <b>${money(shared)}</b></p>` : '')) +
    payoutsPanel(rep, rates, admins) +
    panel(L('Расходы'), `<div class="panel-body">
      <div class="tools">
        <select id="e_city" style="width:auto"><option value="">${L('общий, без города')}</option>
          ${CITIES.map(c => `<option value="${c}">${CITY_LABEL[c]}</option>`).join('')}</select>
        <select id="e_cat" style="width:auto">${(cats || []).map(c =>
          `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
        <input type="date" id="e_at" value="${finTo}">
        <input id="e_amount" placeholder="${L('Сумма')}" style="width:110px" inputmode="decimal">
        <input id="e_note" placeholder="${L('Заметка')}" style="width:200px">
        <button class="btn primary" id="e_add">${L('Записать расход')}</button>
      </div>
      ${(exp || []).length ? table([L('Дата'), L('Город'), L('Категория'), L('Сумма'), L('Заметка'), ''],
        (exp || []).map(e => [`<span class="num">${fday(e.at)}</span>`,
          e.city ? esc(CITY_LABEL[e.city] || e.city) : `<span class="sub">${L('общий')}</span>`,
          esc(catName(e.category_id)), `<span class="num">${money(e.amount)}</span>`,

/* ================= клиенты ================= */
// Карточка на человека, а не на аккаунт: один и тот же покупатель приходит и ботом, и с сайта,
// и по телефону через менеджера. Список и карточку считает база (crm_*), панель только рисует.
let cQuery = '', cOpen = null, cTags = [];

async function loadTags() {
  const { data } = await sb.from('crm_tags').select('*').order('name');
  cTags = data || [];
}
const tagPill = (name, color, extra) =>
  `<span class="pill ${esc(color || 'muted')}" ${extra || ''}>${esc(name)}</span>`;

async function renderCustomers(m) {
  await loadTags();
  const { data, error } = await sb.rpc('crm_contacts', { p_query: cQuery || null, p_limit: 100 });
  if (error) return swap(m, panel(L('Ошибка'), `<div class="empty">${esc(error.message)}</div>`));
  const list = data || [];
  const tagsOf = c => (c.tags || []).map(t => {
    const known = cTags.find(x => x.name === t);
    return tagPill(t, known && known.color);
  }).join(' ');

  // Активный по определению владельца: минимум три выкупленных заказа и покупка за последние
  // 60 дней. Считаем по тому, что уже вернул список, отдельного запроса не нужно.
  const ACTIVE_ORDERS = 3, ACTIVE_DAYS = 60;
  const isActive = c => (c.orders || 0) >= ACTIVE_ORDERS && c.last_order &&
    (Date.now() - new Date(c.last_order).getTime()) < ACTIVE_DAYS * 86400000;

  const rows = list.map(c => [
    `<button class="btn sm" data-copen="${c.id}">${esc(c.full_name || L('без имени'))}</button>` +
      (isActive(c) ? ` <span class="pill ok">${L('активный')}</span>` : '') +
      (c.blocked ? ` <span class="pill danger">${L('заблокирован')}</span>` : ''),
    esc(c.phone || '—') + (c.telegram_id ? `<span class="sub">tg ${c.telegram_id}</span>` : ''),
    esc(CITY_LABEL[c.city] || c.city),
    `<span class="num">${c.orders || 0}</span>`,
    `<span class="num">${money(c.spent || 0)}</span>`,
    c.last_order ? `<span class="num">${fdate(c.last_order)}</span>` : '<span class="sub">—</span>',
    tagsOf(c) || '<span class="sub">—</span>'
  ]);

  swap(m, panel(L('Клиенты'), rows.length
      ? table([L('Клиент'), L('Контакты'), L('Город'), L('Заказов'), L('Куплено на'), L('Последний'), L('Метки')], rows)
      : empty(L('Клиентов пока нет'), L('Карточка заводится сама при первом заказе или брони.')),
      `<input id="cq" placeholder="${L('Имя, телефон или почта')}" style="width:230px" value="${esc(cQuery)}">`) +
    (canDash() ? tagsEditorHTML() : '') +
    '<div id="ccard"></div>');

  const q = document.getElementById('cq');
  if (q) {
    q.oninput = () => { clearTimeout(q._t); q._t = setTimeout(() => { cQuery = q.value.trim(); render(); }, 400); };
    if (cQuery) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  m.querySelectorAll('[data-copen]').forEach(b => b.onclick = () => openContact(+b.dataset.copen));
  bindTagsEditor(m);
  if (cOpen) openContact(cOpen);
}

// Набор меток и их цвета правит владелец: менеджеру они только показываются.
const TAG_COLORS = ['muted', 'accent', 'ok', 'live', 'warn', 'danger', 'new'];
function tagsEditorHTML() {
  const rows = cTags.map(t =>
    `<div class="prow"><span>${tagPill(t.name, t.color)}</span>` +
    `<select data-tagcolor="${esc(t.name)}" style="width:auto">` +
      TAG_COLORS.map(c => `<option value="${c}" ${c === t.color ? 'selected' : ''}>${c}</option>`).join('') +
    `</select><button class="btn sm danger" data-tagdel="${esc(t.name)}">${L('Удалить')}</button></div>`).join('');
  return panel(L('Метки клиентов'), `<div class="panel-body">${rows}
    <div class="tools" style="margin-top:10px">
      <input id="newtag" placeholder="${L('Новая метка')}" style="width:180px" maxlength="24">
      <select id="newtagcolor" style="width:auto">${TAG_COLORS.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      <button class="btn" id="addtag">${L('Добавить')}</button>
    </div></div>`);
}
function bindTagsEditor(m) {
  m.querySelectorAll('[data-tagcolor]').forEach(s => s.onchange = async () => {
    const { error } = await sb.from('crm_tags').update({ color: s.value }).eq('name', s.dataset.tagcolor);
    if (error) return toast(error.message, true);
    toast(L('Сохранено')); render();
  });
  m.querySelectorAll('[data-tagdel]').forEach(b => b.onclick = async () => {
    if (!confirm(L('Удалить метку') + ' ' + b.dataset.tagdel + '?')) return;
    const { error } = await sb.from('crm_tags').delete().eq('name', b.dataset.tagdel);
    if (error) return toast(error.message, true);
    render();
  });
  const add = document.getElementById('addtag');
  if (add) add.onclick = async () => {
    const name = (document.getElementById('newtag').value || '').trim();
    if (!name) return toast(L('Впишите название метки'), true);
    const { error } = await sb.from('crm_tags').insert({ name, color: document.getElementById('newtagcolor').value });
    if (error) return toast(error.message, true);
    render();
  };
}

    const { data: gone, error } = await sb.from('contacts').delete().eq('id', id).select('id');

    send.disabled = true; send.textContent = L('Ставим в очередь…');

    document.getElementById('bcres').textContent = L('В очереди, бот разошлёт за минуту…');
    bcPhoto = null;
    watchBroadcast(data.id);
  };
}
// бот забирает рассылку из очереди, поэтому ждём и показываем реальный итог
async function watchBroadcast(id) {
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const { data } = await sb.from('broadcasts').select('status, sent, failed').eq('id', id).maybeSingle();
    if (!data) continue;
    const res = document.getElementById('bcres');

  if (res) res.textContent = L('Бот пока не забрал очередь. Проверьте, что он запущен на сервере.');

/* ================= dashboard ================= */
// Owner and developer only. Every figure is aggregated by the database (dash_* functions),
// which also enforces the role: the tab being hidden is convenience, not the access control.
const DASH_RANGES = [
  ['today', 'Сегодня'], ['yesterday', 'Вчера'], ['7d', '7 дней'], ['30d', '30 дней'],
  ['quarter', 'Квартал'], ['year', 'Год'], ['all', 'Всё время']
];
let dashRange = localStorage.getItem('kv_dash_range') || '30d';
// Язык выгружаемого отчёта. Помнится отдельно от языка панели, а пока его не выбрали явно,
// следует за языком интерфейса.
let expLangSaved = localStorage.getItem('kv_exp_lang') || '';
let dashCustom = { from: '', to: '' };

function dashBounds() {
  const now = new Date();
  const day = 86400000;
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  let from, to = now;
  if (dashRange === 'custom' && dashCustom.from && dashCustom.to) {
    from = new Date(dashCustom.from + 'T00:00:00');
    to = new Date(dashCustom.to + 'T23:59:59');
  } else if (dashRange === 'today') from = startOfDay(now);
  else if (dashRange === 'yesterday') { to = startOfDay(now); from = new Date(to - day); }
  else if (dashRange === '7d') from = new Date(now - 7 * day);
  else if (dashRange === 'quarter') from = new Date(now - 90 * day);
  else if (dashRange === 'year') from = new Date(now - 365 * day);
  else if (dashRange === 'all') from = new Date('2020-01-01');
  else from = new Date(now - 30 * day);
  const days = (to - from) / day;
  return { from: from.toISOString(), to: to.toISOString(), bucket: days > 120 ? 'month' : 'day' };
}

const nf = n => Number(n || 0).toLocaleString('pl-PL');
const money = n => nf(Math.round(Number(n || 0))) + ' zł';
// Итоги округляются без потерь смысла, а закупочная цена нет: 12,50 показывалось как 13 zł,
// и человек решал, что панель съела правку. Там, где важны гроши, считаем ими.
const money2 = n => Number(n || 0).toLocaleString('pl-PL',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';

// Деньги в полях ввода. У поставщика скидочная цена дробная (45,50), а набирают её и через
// запятую, и через точку, смотря какая раскладка. Принимаем оба вида. Лишние знаки режем
// сразу: колонка всё равно numeric(10,2), и без этого панель после сохранения считала бы
// себя изменённой, сравнивая набранные 45,505 с приехавшими из базы 45,51.
const moneyIn = raw => {
  const s = String(raw == null ? '' : raw).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
};
// Обратно в поле цена печатается по-польски: запятая и два знака, но только когда гроши
// есть. Целое так и остаётся «40», иначе весь прайс покрывается лишними нулями.
const moneyOut = v => {
  if (v == null || v === '') return '';
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',');
};

// Growth against the previous window of the same length. Null when there is nothing to
// compare with, so an empty history does not render as a triumphant +100%.
function trend(now, prev) {
  const a = Number(now || 0), b = Number(prev || 0);
  if (!b) return a ? null : 0;
  return Math.round(((a - b) / b) * 100);
}
function trendHTML(t) {
  if (t == null) return '';
  const cls = t > 0 ? 'up' : t < 0 ? 'down' : 'flat';
  const sign = t > 0 ? '+' : '';
  return `<span class="kpi-t ${cls}">${sign}${t}%</span>`;
}
function kpi(label, value, extra) {
  return `<div class="kpi"><span class="kpi-l">${esc(label)}</span>
    <b class="kpi-v">${value}</b>${extra || ''}</div>`;
}

// Charts are hand-drawn SVG on purpose: the panel has no build step and no dependencies,
// and a chart library would be the single heaviest thing on the page.
// The database only returns buckets that have data, so a month with a single order came back
// as one point and the chart had nothing to draw. Empty days are filled with zeros here, which
// is also what makes a flat stretch visibly flat instead of absent.
function fillSeries(rows, fromISO, toISO, bucket, keys) {
  const byDate = {};
  for (const r of rows) byDate[String(r.bucket).slice(0, 10)] = r;
  const out = [];
  const cur = new Date(fromISO);
  const end = new Date(toISO);
  cur.setHours(12, 0, 0, 0);
  if (bucket === 'month') cur.setDate(1);
  let guard = 0;
  while (cur <= end && guard++ < 400) {
    const iso = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' +
      String(bucket === 'month' ? 1 : cur.getDate()).padStart(2, '0');
    const src = byDate[iso] || {};
    const row = { date: iso, label: dashLabel(iso, bucket) };
    for (const k of keys) row[k] = Number(src[k] || 0);
    out.push(row);
    if (bucket === 'month') cur.setMonth(cur.getMonth() + 1); else cur.setDate(cur.getDate() + 1);
  }
  return out;
}
// Dates are shown the way the shop writes them everywhere else: DD-MM-YYYY.
function dashLabel(iso, bucket) {
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return bucket === 'month' ? m + '-' + y : d + '-' + m + '-' + y;
}

function lineChart(rows, yKey, opts) {
  const o = opts || {};
  if (!rows.length) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  const vals = rows.map(r => Number(r[yKey] || 0));
  const max = Math.max(...vals, 1);
  const W = 600, H = 170, PL = 6, PR = 6, PT = 14, PB = 26;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  const fmt = v => o.money ? money(v) : nf(v);
  const grid = [0, 0.5, 1].map(f => {
    const y = PT + plotH * (1 - f);
    return `<line class="grid" x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}"></line>` +
      `<text class="grid-t" x="${PL}" y="${y - 3}">${fmt(Math.round(max * f))}</text>`;
  }).join('');

  // A single bucket has no line to draw, so it is shown as one column instead of a stray dot.
  if (rows.length === 1) {
    const h = Math.max(3, (vals[0] / max) * plotH);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${grid}
      <rect class="chart-bar" x="${W / 2 - 26}" y="${PT + plotH - h}" width="52" height="${h}"></rect>
      </svg><div class="chart-x"><span>${esc(rows[0].label)}</span><span>${fmt(vals[0])}</span></div>`;
  }

  const step = plotW / (rows.length - 1);
  const xy = i => [PL + step * i, PT + plotH - (vals[i] / max) * plotH];
  const line = rows.map((_, i) => xy(i).join(',')).join(' ');
  const area = `${PL},${PT + plotH} ${line} ${PL + step * (rows.length - 1)},${PT + plotH}`;
  // Dots only where something happened, otherwise a quiet month is a wall of circles.
  const dots = rows.map((r, i) => {
    if (!vals[i]) return '';
    const [x, y] = xy(i);
    return `<circle cx="${x}" cy="${y}" r="2.6"><title>${esc(r.label)}: ${fmt(vals[i])}</title></circle>`;
  }).join('');
  const mid = rows[Math.floor(rows.length / 2)];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${grid}
    <polygon class="chart-area" points="${area}"></polygon>
    <polyline class="chart-line" points="${line}"></polyline>${dots}</svg>
    <div class="chart-x"><span>${esc(rows[0].label)}</span><span>${esc(mid.label)}</span><span>${esc(rows[rows.length - 1].label)}</span></div>`;
}

function barChart(rows, labelKey, valueKey, opts) {
  const o = opts || {};
  if (!rows.length) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  const max = Math.max(...rows.map(r => Number(r[valueKey] || 0)), 1);
  return `<div class="bars">${rows.map(r => {
    const v = Number(r[valueKey] || 0);
    return `<div class="bar-row"><span class="bar-l">${esc(o.label ? o.label(r) : r[labelKey])}</span>
      <span class="bar-t"><i style="width:${Math.max(2, (v / max) * 100)}%"></i></span>
      <b class="bar-v">${o.money ? money(v) : nf(v)}</b></div>`;
  }).join('')}</div>`;
}
function donut(rows, labelKey, valueKey, colors) {
  const total = rows.reduce((s, r) => s + Number(r[valueKey] || 0), 0);
  if (!total) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  let acc = 0;
  const R = 54, C = 2 * Math.PI * R;
  const arcs = rows.map((r, i) => {
    const share = Number(r[valueKey] || 0) / total;
    const dash = `${(share * C).toFixed(2)} ${(C - share * C).toFixed(2)}`;
    const off = (-acc * C).toFixed(2);
    acc += share;
    return `<circle class="ring" r="${R}" cx="70" cy="70" stroke="${colors[i % colors.length]}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}"></circle>`;
  }).join('');
  const legend = rows.map((r, i) =>
    `<li><i style="background:${colors[i % colors.length]}"></i>${esc(r[labelKey])}
      <b>${nf(r[valueKey])}</b></li>`).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 140 140">${arcs}</svg>
    <ul class="donut-legend">${legend}</ul></div>`;
}

      ${kpi(L('Прибыль'), money(finSum('profit') - sharedExp))}
      ${kpi(L('Средний чек'), money(k.avg_check), trendHTML(trend(k.avg_check, k.avg_check_prev)))}

    group(L('Заказы за период'), `<div class="kpis">

      ${kpi(L('Покупали в периоде'), nf(k.users_active))}

  const ordersS = fillSeries(s.orders || [], from, to, bucket, ['orders', 'done', 'revenue', 'avg_check']);

    ${panel(L('Популярные вкусы'), `<div class="panel-body">${barChart(p.top_flavors || [], 'name', 'qty')}</div>`)}
    ${panel(L('Бренды'), `<div class="panel-body">${barChart(p.by_brand || [], 'brand', 'revenue', { money: true })}</div>`)}

  ${panel(L('Заканчивается'), table([L('Товар'), L('Вкус'), L('Город'), L('Остаток')],
    (p.low_stock || []).map(r => [esc(r.name), esc(r.flavor || '—'), esc(CITY_LABEL[r.city] || r.city), `<span class="num">${r.qty}</span>`])) ||

  // Движение товара. Приход это проведённые поставки, расход это выданные заказы и списания,

        { label: r => CITY_LABEL[r.city] || r.city })}</div>`)}
      ${panel(L('Больше всего пришло'), `<div class="panel-body">${barChart(mov.top_in || [], 'name', 'qty', { label: movLabel })}</div>`)}
      ${panel(L('Больше всего ушло'), `<div class="panel-body">${barChart(mov.top_out || [], 'name', 'qty', { label: movLabel })}</div>`)}
    </div>
    ${panel(L('Последние движения'), table([L('Когда'), L('Товар'), L('Город'), L('Причина'), L('Штук'), L('Стало')],
      (mov.moves || []).map(r => [
        `<span class="num">${fdate(r.at)}</span>`,
        esc(r.name) + (r.flavor ? `<span class="sub">${esc(r.flavor)}</span>` : ''),
        esc(CITY_LABEL[r.city] || r.city),
        `<span class="pill ${MOVE_CLS[r.reason] || ''}">${esc(L(MOVE_RU[r.reason] || r.reason))}</span>` +
          (r.ref_id ? `<span class="sub">#${r.ref_id}</span>` : ''),
        `<span class="num">${r.delta > 0 ? '+' : ''}${nf(r.delta)}</span>`,
        `<span class="num">${nf(r.qty_after)}</span>`])) ||
