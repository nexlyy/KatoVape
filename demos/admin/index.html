    <p class="hint">${L('Правка остатка в карточке товара тоже попадает в журнал: если склад разошёлся с документами, видно, кто и когда его подвинул.')}</p>`;

  const system = isDev ? panel(L('Система'), `<div class="panel-body">
    <div class="kpis">
      ${kpi(L('Размер базы'), esc(sys.db_size || '—'))}
      ${kpi(L('Версия Postgres'), esc(sys.db_version || '—'))}
      ${kpi(L('Версия схемы'), esc(sys.schema_version || '—'))}
      ${kpi(L('Соединений'), nf(sys.connections))}
      ${kpi(L('Заданий в очереди'), nf(sys.jobs_pending))}
      ${kpi(L('Ошибок за сутки'), nf(sys.jobs_failed_24h))}
      ${kpi(L('Рассылок в очереди'), nf(sys.broadcast_queue))}
      ${kpi(L('Зависших оплат'), nf(sys.orders_stuck))}
      ${kpi(L('Бот'), sys.bot ? esc(sys.bot.version || '—') : L('нет сигнала'))}
      ${kpi(L('Бот на связи'), sys.bot ? fdate(sys.bot.beat_at) : '—')}
      ${kpi(L('Память бота'), sys.bot && sys.bot.rss_mb ? sys.bot.rss_mb + ' MB' : '—')}
      ${kpi(L('Node'), sys.bot ? esc(sys.bot.node || '—') : '—')}
    </div>
    ${barChart(sys.tables || [], 'name', 'bytes', { label: r => r.name + ' · ' + r.size })}
  </div>`) : '';

  // Журнал действий: кто менял статус, кто правил цену, кто списывал. Пишут его функции
  // crm_set_status, supply_post и write_off_add, а бот кладёт свою строку сам.
  const { data: audit } = await sb.from('audit_log')
    .select('at,actor_role,action,entity,entity_id,detail').order('at', { ascending: false }).limit(40);
  const auditPanel = panel(L('Журнал действий'), (audit || []).length
    ? table([L('Когда'), L('Кто'), L('Что'), L('Объект'), L('Подробности')],
        (audit || []).map(a => [`<span class="num">${fdate(a.at)}</span>`,
          esc(a.actor_role || '—'), esc(a.action), esc(a.entity + ' ' + (a.entity_id || '')),
          `<span class="sub">${esc(JSON.stringify(a.detail || {}).slice(0, 90))}</span>`]))
    : `<div class="panel-body"><p class="dash-none">${L('Записей пока нет')}</p></div>`);

  const fold = (title, body, open) =>
    `<details class="fold" ${open ? 'open' : ''}><summary>${esc(title)}</summary>${body}</details>`;

  // Выгрузка отчёта. Язык выбирается отдельно от языка панели: владелец может сидеть в
  // русском интерфейсе и отправить бухгалтеру польский файл.
  const expLang = expLangSaved || admLang;
  const expLangs = (window.KVExport ? KVExport.LANGS : [])
    .map(([l, lb]) => `<option value="${l}" ${l === expLang ? 'selected' : ''}>${lb}</option>`).join('');
  const expBar = window.KVExport ? `<div class="tools exp-bar">

      <button class="btn sm" data-exp="csv">CSV</button>

      <button class="btn sm" data-exp="docx">DOCX</button>

  m.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    dashRange = b.dataset.range;
    localStorage.setItem('kv_dash_range', dashRange);
    render();
  });

  const xl = document.getElementById('x_lang');
  if (xl) xl.onchange = () => { expLangSaved = xl.value; localStorage.setItem('kv_exp_lang', expLangSaved); };
  m.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => {
    // Считаем по тем же данным, что уже нарисованы на экране: ни одного лишнего запроса,
    // и в файле ровно те цифры, что человек видит.
    const doc = KVExport.build(expLangSaved || admLang, {
      from: from.slice(0, 10), to: to.slice(0, 10), cityLabel: CITY_LABEL,
      kpi: k, fin: rep, stock: mov, products: p, managers: mg, customers: c
    });
    const how = b.dataset.exp;
    if (how === 'pdf') {
      if (!KVExport.toPrint(doc)) toast(L('Браузер заблокировал окно печати. Разрешите всплывающие окна для этой страницы.'), true);
      return;
    }
    const blob = how === 'csv' ? KVExport.csv(doc) : how === 'xlsx' ? KVExport.xlsx(doc) : KVExport.docx(doc);
    KVExport.download(KVExport.fileName(doc, how), blob);
    toast(L('Файл готов'));
  });
  const apply = document.getElementById('d_apply');
  if (apply) apply.onclick = () => {
    dashCustom = { from: document.getElementById('d_from').value, to: document.getElementById('d_to').value };
    if (!dashCustom.from || !dashCustom.to) return toast(L('Укажите обе даты'), true);
    render();

}

/* ================= промокоды ================= */
// Правила лежат в базе, скидку считает функция promo_check, панель только заводит условия.
const PROMO_KINDS = [['percent', '%'], ['fixed', 'zł']];

async function renderPromo(m) {
  const { data } = await sb.from('promo_codes').select('*').order('created_at', { ascending: false });
  const list = data || [];
  const now = Date.now();
  const statusOf = c => {
    if (!c.active) return ['off', L('выключен')];
    if (c.expires_at && new Date(c.expires_at).getTime() < now) return ['off', L('истёк')];
    if (c.starts_at && new Date(c.starts_at).getTime() > now) return ['new', L('ещё не начался')];
    if (c.max_uses != null && c.used >= c.max_uses) return ['off', L('исчерпан')];
    return ['ok', L('работает')];
  };
  const rows = list.map(c => {
    const [cls, label] = statusOf(c);
    const cond = [
      c.city ? CITY_LABEL[c.city] || c.city : null,
      c.category ? c.category : null,
      c.min_sum ? L('от') + ' ' + money2(c.min_sum) : null,
      c.per_user ? c.per_user + ' ' + L('раз на человека') : null
    ].filter(Boolean).join(' · ');
    const period = [c.starts_at ? fdate(c.starts_at) : null, c.expires_at ? fdate(c.expires_at) : null]
      .filter(Boolean).join(' ... ') || '<span class="sub">' + L('без срока') + '</span>';
    return [
      `<b class="num">${esc(c.code)}</b>` + (c.note ? `<span class="sub">${esc(c.note)}</span>` : ''),
      `<span class="num">${c.kind === 'percent' ? c.value + ' %' : c.value + ' zł'}</span>`,
      cond || '<span class="sub">' + L('без условий') + '</span>',
      period,
      `<span class="num">${c.used}${c.max_uses != null ? ' / ' + c.max_uses : ''}</span>`,
      `<span class="pill ${cls}">${label}</span>`,
      `<div class="tools"><button class="btn sm" data-ptoggle="${esc(c.code)}">${c.active ? L('Выключить') : L('Включить')}</button>` +
      `<button class="btn sm danger" data-pdel="${esc(c.code)}">${L('Удалить')}</button></div>`
    ];
  });

  swap(m, panel(L('Действующие коды'), rows.length
      ? table([L('Код'), L('Скидка'), L('Условия'), L('Срок'), L('Использован'), L('Статус'), ''], rows)
      : empty(L('Промокодов нет'), L('Заведите первый код формой ниже.'))) +
    panel(L('Новый промокод'), `<div class="panel-body">
      <div class="pform">
        <label class="f">${L('Код')}<input id="pc_code" placeholder="LETO10" maxlength="24"></label>
        <label class="f">${L('Тип скидки')}<select id="pc_kind">
          ${PROMO_KINDS.map(([k, u]) => `<option value="${k}">${k === 'percent' ? L('Процент') : L('Сумма')} (${u})</option>`).join('')}
        </select></label>
        <label class="f">${L('Размер')}<input id="pc_value" inputmode="decimal" placeholder="10"></label>
        <label class="f">${L('Город')}<select id="pc_city">
          <option value="">${L('все города')}</option>
          ${CITIES.map(c => `<option value="${c}">${CITY_LABEL[c]}</option>`).join('')}
        </select></label>
        <label class="f">${L('Категория')}<select id="pc_cat">
          <option value="">${L('весь ассортимент')}</option>
          ${PROMO_CATS.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select></label>
        <label class="f">${L('Минимальная сумма')}<input id="pc_min" inputmode="decimal" placeholder="0"></label>
        <label class="f">${L('Лимит всего')}<input id="pc_max" inputmode="numeric" placeholder="${L('без лимита')}"></label>
        <label class="f">${L('Раз на человека')}<input id="pc_per" inputmode="numeric" value="1"></label>
        <label class="f">${L('Действует с')}<input id="pc_from" type="date"></label>
        <label class="f">${L('Действует до')}<input id="pc_to" type="date"></label>
        <label class="f">${L('Складывать с другими')}<select id="pc_stack">
          <option value="1">${L('да')}</option>
          <option value="0">${L('нет, только отдельно')}</option>
        </select></label>
        <label class="f pform-wide">${L('Заметка')}<input id="pc_note" placeholder="${L('для чего этот код')}"></label>
      </div>
      <div class="tools" style="margin-top:12px"><button class="btn primary" id="pc_add">${L('Создать промокод')}</button></div>
      <p class="hint">${L('Процент считается от суммы товаров без доставки. Скидка не может превысить корзину.')}</p>
    </div>`));

  const add = document.getElementById('pc_add');
  if (add) add.onclick = async () => {
    const code = (document.getElementById('pc_code').value || '').trim();
    const value = Number((document.getElementById('pc_value').value || '').replace(',', '.'));
    if (!/^[A-Za-z0-9_-]{3,24}$/.test(code)) return toast(L('Код: латиница, цифры, от 3 до 24 знаков'), true);
    if (!Number.isFinite(value) || value <= 0) return toast(L('Размер скидки указан неверно'), true);
    const num = id => { const v = (document.getElementById(id).value || '').trim(); return v === '' ? null : Number(v); };
    const day = (id, end) => {
      const v = document.getElementById(id).value;
      return v ? new Date(v + (end ? 'T23:59:59' : 'T00:00:00')).toISOString() : null;
    };
    add.disabled = true;
    const { error } = await sb.from('promo_codes').insert({
      code, kind: document.getElementById('pc_kind').value, value,
      city: document.getElementById('pc_city').value || null,
      category: document.getElementById('pc_cat').value || null,
      stackable: document.getElementById('pc_stack').value === '1',
      min_sum: moneyIn(document.getElementById('pc_min').value) || 0,
      max_uses: num('pc_max'), per_user: num('pc_per') ?? 1,
      starts_at: day('pc_from'), expires_at: day('pc_to', true),
      note: (document.getElementById('pc_note').value || '').trim() || null
    });
    add.disabled = false;
    if (error) return toast(error.code === '23505' ? L('Такой код уже есть') : error.message, true);
    toast(L('Промокод создан'));
    render();
  };

  m.querySelectorAll('[data-ptoggle]').forEach(b => b.onclick = async () => {
    const code = b.dataset.ptoggle;

function grantErr(error) {
  const s = String(error.message || '');
  if (s.includes('NO_USER')) return L('Такого аккаунта нет. По Telegram ID можно выдать заранее.');

  if (s.includes('BAD_ROLE')) return L('Неизвестная роль');
  return s;
}

function tierP(tiers, q) { const t = (tiers || []).find(x => +x.q === q); return t && t.p != null ? t.p : ''; }
// Нормализованная подпись ступеней: «3:36|5:33|10:30». База отдаёт jsonb со своим порядком
// ключей ({"p":40,"q":1}), поэтому сравнивать JSON-строки нельзя, панель несохранённых
// правок из-за этого висела всегда, даже когда ничего не меняли.
function tiersKey(tiers) {
  if (!tiers || !tiers.length) return '';
  return [...tiers].map(x => Number(x.q) + ':' + Number(x.p))
    .sort((a, b) => parseInt(a) - parseInt(b)).join('|');
}
// Понятный текст вместо сырого ответа PostgREST. Чаще всего это не ошибка данных:
// после миграции, добавившей колонку, у API какое-то время живёт старый кеш схемы, и
// сохранение «Хита» падает, хотя в базе всё на месте.
function productsErr(error) {
  const m = String((error && error.message) || '');
  if ((error && error.code === 'PGRST204') || /schema cache/i.test(m))
    return L('База ещё не знает про это поле. Примените миграции и обновите схему API (Supabase → Settings → API → Reload schema), потом повторите.');
  if (/row-level security|permission denied/i.test(m))
    return L('Нет прав на этот товар: проверьте город, закреплённый за вашей ролью.');
  return m || L('Не удалось сохранить');
}
// Ступени приходят уже числами (moneyIn их разобрал), пустое поле это null.
function buildTiers(base, t3, t5, t10) {
  const arr = [];
  if (Number.isFinite(base)) arr.push({ q: 1, p: base });
  [[3, t3], [5, t5], [10, t10]].forEach(([q, p]) => { if (Number.isFinite(p)) arr.push({ q, p }); });
  return arr.length > 1 ? arr : null;   // только база или пусто, ступеней нет
}
function changedItems() {
  const m = document.getElementById('main'); if (!m) return [];
  const out = [];
  groups.forEach((g, gi) => {
    const card = m.querySelector('.item[data-g="' + gi + '"]'); if (!card) return;
    const gv = k => card.querySelector('[data-p="' + k + '"]').value.trim();
    const name = gv('name'), brand = gv('brand'), category = gv('category'), nic = gv('nic');
    const costRaw = gv('cost'), cost = moneyIn(costRaw);
    const priceRaw = gv('price'), price = moneyIn(priceRaw);
    const tierRaw = ['t3', 't5', 't10'].map(gv);
    const tierNum = tierRaw.map(moneyIn);
    const labels = LABELS.map(([id]) => id).filter(id => card.querySelector('[data-lb="' + id + '"]').checked);
    const hit = labels.includes('hit');
    const tiers = buildTiers(price, tierNum[0], tierNum[1], tierNum[2]);
    const tiersChanged = tiersKey(tiers) !== tiersKey(g.head.tiers);
    const was = v => (v == null ? null : Number(v));   // numeric приезжает из базы по-разному
    const headChanged = name !== (g.head.name || '') || brand !== (g.head.brand || '')
      || category !== (g.head.category || '') || nic !== (g.head.nic || '') || price !== was(g.head.price) || tiersChanged
      || labels.join(',') !== (g.head.labels || []).slice().sort().join(',')
      || cost !== was(g.head.cost);
    const rows = [];
    g.items.forEach((r, ri) => {
      const row = card.querySelector('.flav[data-f="' + gi + ':' + ri + '"]'); if (!row) return;
      const qtyRaw = row.querySelector('[data-q]').value.trim();
      const qty = qtyRaw === '' ? 0 : Number(qtyRaw);
      // цвет, профиль и описание живут в flavor_meta и сохраняются своей кнопкой:
      // они общие для городов, а здесь считаются правки этого города
      row.classList.toggle('dirty', qty !== r.qty);
      if (headChanged || qty !== r.qty) rows.push({ r, qty });
    });
    card.classList.toggle('dirty', headChanged);
    // Опечатка в ступени раньше проходила молча: нечисло просто не попадало в tiers, и
    // оптовая цена тихо возвращалась к розничной. Ругаемся на любое поле с деньгами.
    const notNum = (raw, v) => raw !== '' && !Number.isFinite(v);
    if (rows.length) out.push({ g, name, brand, category, nic, price, tiers, hit, labels, cost, rows,
      bad: notNum(priceRaw, price) || notNum(costRaw, cost) || tierRaw.some((raw, i) => notNum(raw, tierNum[i])) });
  });
  return out;
}
function clearDirty() { updateSaveBar(); }
function updateSaveBar() {
  const bar = document.getElementById('savebar'); if (!bar) return;
  const n = changedItems().length;
  bar.classList.toggle('show', n > 0);
  const c = document.getElementById('sb-count');
  const note = document.getElementById('sb-note');
  if (c) c.textContent = n === 1 ? L('Изменён один товар') : L('Изменено товаров: ') + n;
  if (note) note.textContent = L('изменения ещё не сохранены');
}

  const [{ data }, { data: meta }] = await Promise.all([
    sb.from('products').select('*').eq('city', cityNow).order('id').order('flavor'),
    sb.from('flavor_meta').select('product_id,flavor,tint,taste,descr')

  flavorMeta = {};
  (meta || []).forEach(m => { flavorMeta[flKey(m.product_id, m.flavor)] = m; });
  const rows = data || [];
  groups = []; const byId = {};
  rows.forEach(r => {

        <input class="i-price" data-p="price" value="${moneyOut(g.head.price)}" placeholder="${L('Цена zł')}" inputmode="decimal">
        <input class="i-price" data-p="cost" value="${moneyOut(g.head.cost)}" placeholder="${L('Закупка zł')}" inputmode="decimal" title="${L('Закупочная цена за штуку')}">
        <input class="i-tier" data-p="t3" value="${moneyOut(tierP(g.head.tiers, 3))}" placeholder="3 ${L('шт')}" inputmode="decimal" title="${L('Цена за штуку при')} 3 ${L('шт')}">
        <input class="i-tier" data-p="t5" value="${moneyOut(tierP(g.head.tiers, 5))}" placeholder="5 ${L('шт')}" inputmode="decimal" title="${L('Цена за штуку при')} 5 ${L('шт')}">
        <input class="i-tier" data-p="t10" value="${moneyOut(tierP(g.head.tiers, 10))}" placeholder="10 ${L('шт')}" inputmode="decimal" title="${L('Цена за штуку при')} 10 ${L('шт')}">
        ${LABELS.map(([id, name]) => `<label class="i-hit"><input type="checkbox" data-lb="${id}"
          ${(g.head.labels || []).includes(id) ? 'checked' : ''}> ${L(name)}</label>`).join('')}
        <button class="btn sm danger" data-delp="${gi}">${L('Удалить товар')}</button>
      </div>
      <div class="item-id">${esc(g.id)}</div>
      <div class="flavs">${g.items.map((r, ri) => {
        const meta = flavorMeta[flKey(r.id, r.flavor)] || {};
        const set = [meta.tint, meta.taste, meta.descr && Object.keys(meta.descr).length].filter(Boolean).length;
        return `

            ${r.flavor ? '' : 'disabled title="' + L('У товара без вкусов настраивать нечего') + '"'}>
            <span class="tint-dot" style="background:${tintGrad(meta.tint)}"></span>
            ${L('Настроить')}${set ? ` <em>${set}/3</em>` : ''}
          </button>
          <button class="btn sm" data-woff="${gi}:${ri}" title="${L('Списать')}">${L('Списать')}</button>
          <button class="btn sm danger" data-delf="${gi}:${ri}" title="${L('Удалить вкус')}">×</button>
        </div>
        <div class="fl-slot" data-fs="${gi}:${ri}">${flOpen === gi + ':' + ri ? flavorCard(r) : ''}</div>`;
      }).join('')}</div>
      <div class="add-flav">
        <input data-nf="${gi}" placeholder="${L('Новый вкус')}" style="width:180px">
        <input data-nq="${gi}" placeholder="${L('шт')}" style="width:74px" inputmode="numeric">
        <button class="btn sm" data-addf="${gi}">${L('Добавить вкус')}</button>
      </div>
    </div>`).join('') : empty(L('В этом городе пусто'), L('Добавьте первый товар формой ниже.'));

  swap(m, panel(L('Товары · ') + cityNow, body, tools) + panel(L('Новый товар'), `<div class="panel-body">
      <div class="tools">
        <input id="np_id" placeholder="${L('id, например hqd')}" style="width:150px">
        <input id="np_name" placeholder="${L('Название')}" style="width:170px">
        <input id="np_cat" placeholder="${L('Категория')}" style="width:140px">
        <input id="np_flavor" placeholder="${L('Вкус, можно пусто')}" style="width:170px">
        <input id="np_price" placeholder="${L('Цена')}" style="width:90px" inputmode="decimal">
        <input id="np_qty" placeholder="${L('шт')}" style="width:74px" inputmode="numeric">
        <button class="btn primary" id="np_add">${L('Добавить')}</button>
      </div>
      <p class="hint">${L('id должен совпадать с товаром на витрине, тогда наличие подтянется в карточку.')}</p>
    </div>`));

  bindProducts(m);
  updateSaveBar();
}

// ---- карточка вкуса: палитра, профиль, описания ----
//
// Палитра собрана руками, без библиотек: страница панели ходит только на свои файлы и в
// Supabase, и тянуть ради выбора цвета чужой скрипт с CDN мимо этой политики не хочется.
// Внутри всё живёт в HSV, наружу отдаётся #rrggbb.
function bindFlavorCard(slot, r) {
  const card = slot.querySelector('.fl-edit'); if (!card) return;
  const $ = s => card.querySelector(s);
  const sv = $('[data-sv]'), hue = $('[data-hue]'), hexIn = $('[data-hex]'), prev = $('[data-prev]');
  const T = TINT();
  let hsv = T.toHsv(T.norm(hexIn.value) || '#5ff3d0');
  let on = !!T.norm(hexIn.value);          // цвет назначен или «по названию»

  function paint(writeField) {
    const hex = T.fromHsv(hsv.h, hsv.s, hsv.v);
    sv.style.background = 'linear-gradient(to top,#000,transparent),' +
      'linear-gradient(to right,#fff,' + T.fromHsv(hsv.h, 100, 100) + ')';
    sv.querySelector('.tint-dot-sv').style.left = hsv.s + '%';
    sv.querySelector('.tint-dot-sv').style.bottom = hsv.v + '%';
    hue.querySelector('.tint-dot-hue').style.left = (hsv.h / 360 * 100) + '%';
    prev.style.background = on ? T.grad(hex) : 'var(--line-2)';
    card.classList.toggle('tint-off', !on);
    if (writeField) hexIn.value = on ? hex : '';
  }
  // Тянем и мышью, и пальцем: pointer-события покрывают оба, а setPointerCapture не даёт
  // потерять курсор, когда его уводят за край квадрата.
  function drag(el, onMove) {
    const go = e => {
      const b = el.getBoundingClientRect();
      onMove(Math.min(Math.max((e.clientX - b.left) / b.width, 0), 1),
             Math.min(Math.max((e.clientY - b.top) / b.height, 0), 1));
      on = true; paint(true);
    };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); go(e);
      const move = ev => go(ev);
      const up = ev => {
        el.releasePointerCapture(ev.pointerId);
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }
  drag(sv, (x, y) => { hsv.s = x * 100; hsv.v = (1 - y) * 100; });
  drag(hue, x => { hsv.h = x * 360; });

  hexIn.oninput = () => {
    const hex = T.norm(hexIn.value);
    if (!hex) { on = hexIn.value.trim() === '' ? false : on; card.classList.toggle('bad', !!hexIn.value.trim()); return; }
    card.classList.remove('bad');
    hsv = T.toHsv(hex); on = true; paint(false);
  };
  card.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
    hsv = T.toHsv(b.dataset.sw); on = true; paint(true); card.classList.remove('bad');
  });
  $('[data-tint-off]').onclick = () => { on = false; paint(true); card.classList.remove('bad'); };

  // ---- вкусовой профиль ----
  const sliders = [...card.querySelectorAll('[data-ts]')];
  const setAuto = auto => {
    sliders.forEach(s => { s.disabled = auto; });
    card.querySelectorAll('[data-tsv]').forEach(b => {
      const s = card.querySelector('[data-ts="' + b.dataset.tsv + '"]');
      b.textContent = auto ? '—' : Math.max(1, Math.round(s.value / 10));
    });
    $('[data-ts-auto]').classList.toggle('primary', auto);
    $('[data-ts-on]').classList.toggle('primary', !auto);
  };
  sliders.forEach(s => s.oninput = () => {
    card.querySelector('[data-tsv="' + s.dataset.ts + '"]').textContent = Math.max(1, Math.round(s.value / 10));
  });
  $('[data-ts-auto]').onclick = () => setAuto(true);
  $('[data-ts-on]').onclick = () => setAuto(false);

  // ---- описания: язык переключается вкладками, тексты живут все три сразу ----
  card.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => {
    card.querySelectorAll('[data-dl]').forEach(x => x.classList.toggle('primary', x === b));
    card.querySelectorAll('[data-d]').forEach(t => { t.hidden = t.dataset.d !== b.dataset.dl; });
  });

  $('[data-fl-save]').onclick = async (e) => {
    const btn = e.currentTarget;
    const hex = T.norm(hexIn.value);
    if (hexIn.value.trim() && !hex) return toast(L('Цвет не разобран: нужен вид #5FF3D0'), true);
    const auto = sliders[0].disabled;
    const descr = {};
    card.querySelectorAll('[data-d]').forEach(t => {
      const v = t.value.trim();
      if (v) descr[t.dataset.d] = v;
    });
    const row = {
      product_id: r.id, flavor: r.flavor,
      tint: on && hex ? hex : null,
      taste: auto ? null : Object.fromEntries(sliders.map(s => [s.dataset.ts, +s.value])),
      descr: Object.keys(descr).length ? descr : null,
      updated_at: new Date().toISOString()
    };
    btn.disabled = true;
    const { error } = await sb.from('flavor_meta').upsert([row], { onConflict: 'product_id,flavor' });
    btn.disabled = false;
    if (error) return toast(productsErr(error), true);
    flavorMeta[flKey(r.id, r.flavor)] = row;
    toast(L('Вкус настроен'));
    render();
  };

  paint(false);
}

function bindProducts(m) {
  // Раскрытие карточки не перерисовывает список: иначе пропала бы прокрутка и правки
  // в соседних полях, которые ещё не сохранены.
  m.querySelectorAll('[data-fl]').forEach(b => b.onclick = () => {
    const key = b.dataset.fl;
    const [gi, ri] = key.split(':').map(Number);
    const r = groups[gi] && groups[gi].items[ri]; if (!r || !r.flavor) return;
    const slot = m.querySelector('.fl-slot[data-fs="' + key + '"]');
    const openNow = flOpen === key;
    // открыт всегда один: две палитры рядом сбивают с толку, а место занимают
    m.querySelectorAll('.fl-slot').forEach(s => { s.innerHTML = ''; });
    m.querySelectorAll('[data-fl]').forEach(x => x.classList.remove('primary'));
    flOpen = openNow ? '' : key;
    if (openNow) return;
    b.classList.add('primary');
    slot.innerHTML = flavorCard(r);
    bindFlavorCard(slot, r);
    slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  // Список перерисовывается после каждого сохранения, и раскрытая карточка приезжает
  // заново разметкой, но без обработчиков: палитра не рисовалась, ползунки не считались,
  // кнопки молчали. Со стороны это выглядело как зависшая панель, которую лечит только
  // закрыть и открыть. Оживляем то, что осталось раскрытым.
  if (flOpen) {
    const [gi, ri] = flOpen.split(':').map(Number);
    const r = groups[gi] && groups[gi].items[ri];
    const slot = m.querySelector('.fl-slot[data-fs="' + flOpen + '"]');
    if (r && slot && slot.firstElementChild) bindFlavorCard(slot, r);
    else flOpen = '';       // товар или вкус исчез после сохранения
  }
  m.querySelectorAll('[data-city]').forEach(b => b.onclick = () => {
    if (hasChanges() && !confirm(L('Есть несохранённые изменения. Сменить город и потерять их?'))) return;
    clearDirty(); cityNow = b.dataset.city; render();
  });
  const pq = document.getElementById('pq');
  const applyFilter = () => {
    const v = prodQuery.toLowerCase();
    m.querySelectorAll('.item').forEach(it => {
      it.style.display = !v || it.dataset.search.indexOf(v) >= 0 ? '' : 'none';
    });
  };
  if (pq) {
    pq.oninput = () => { prodQuery = pq.value.trim(); applyFilter(); };
    if (prodQuery) { applyFilter(); pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); }
  }
  // возвращаем прокрутку туда, где человек работал
  if (prodScroll) { const y = prodScroll; prodScroll = 0; requestAnimationFrame(() => window.scrollTo(0, y)); }
  // Пересчитываем при каждом касании поля: вернул значение обратно — панель сама уходит.
  // Слушаем и input, и change: списку и галочке первое событие не полагается. Раньше в
  // условии стоял data-p="hit", которого у меток нет, и снятая галочка полосу не поднимала.
  // Поля товара и остатки; карточка вкуса сохраняется своей кнопкой и сюда не входит.
  const FIELDS = '[data-p],[data-q],[data-lb]';
  m.querySelectorAll('.item').forEach(card => {
    card.addEventListener('input', e => { if (e.target.closest(FIELDS)) updateSaveBar(); });
    card.addEventListener('change', e => { if (e.target.closest(FIELDS)) updateSaveBar(); });
  });
  m.querySelectorAll('[data-delp]').forEach(b => b.onclick = async () => {
    const g = groups[+b.dataset.delp]; if (!g) return;
    if (!confirm(L('Удалить «') + (g.head.name || g.id) + L('» со всеми вкусами?'))) return;
    const { error } = await sb.from('products').delete().match({ id: g.id, city: cityNow });
    if (error) return toast(error.message, true);
    toast(L('Товар удалён')); clearDirty(); render();
  });
  // Списание: брак, порча, недостача или взяли себе. Меняет и остаток, и деньги, поэтому
  // уходит документом, но живёт кнопкой в карточке товара, а не отдельным разделом.
  const WOFF = [['broken', 'брак'], ['spoiled', 'порча'], ['shortage', 'недостача'],
                ['own', 'себе'], ['other', 'другое']];
  m.querySelectorAll('[data-woff]').forEach(b => b.onclick = () => {
    const [gi, ri] = b.dataset.woff.split(':').map(Number);
    const r = groups[gi] && groups[gi].items[ri]; if (!r) return;
    const row = b.closest('.flav');
    row.innerHTML = `<span class="flav-n">${esc(r.flavor || L('без вкуса'))}</span>
      <input class="wq" placeholder="${L('штук')}" style="width:80px" inputmode="numeric">
      <select class="wr" style="width:auto">${WOFF.map(([v, n]) =>
        `<option value="${v}">${L(n)}</option>`).join('')}</select>
      <input class="wn" placeholder="${L('Причина')}" style="width:150px">
      <button class="btn sm danger wgo">${L('Списать')}</button>
      <button class="btn sm quiet wno">${L('Отмена')}</button>`;
    row.querySelector('.wno').onclick = () => render();
    row.querySelector('.wgo').onclick = async () => {
      const qty = parseInt(row.querySelector('.wq').value, 10);
      if (!Number.isFinite(qty) || qty <= 0) return toast(L('Штук должно быть больше нуля'), true);
      const { error } = await sb.rpc('write_off_add', {
        p_city: r.city, p_product: r.id, p_flavor: r.flavor || '', p_qty: qty,
        p_reason: row.querySelector('.wr').value, p_note: row.querySelector('.wn').value || null });
      if (error) return toast(error.message, true);
      toast(L('Списано')); clearDirty(); render();
    };
  });
  m.querySelectorAll('[data-delf]').forEach(b => b.onclick = async () => {
    const [gi, ri] = b.dataset.delf.split(':').map(Number);
    const r = groups[gi] && groups[gi].items[ri]; if (!r) return;
    if (!confirm(L('Удалить вкус «') + (r.flavor || L('без вкуса')) + '»?')) return;
    const { error } = await sb.from('products').delete().match({ id: r.id, city: r.city, flavor: r.flavor });
    if (error) return toast(error.message, true);
    toast(L('Вкус удалён')); clearDirty(); render();
  });
  m.querySelectorAll('[data-addf]').forEach(b => b.onclick = async () => {
    const gi = +b.dataset.addf, g = groups[gi]; if (!g) return;
    const fl = m.querySelector('[data-nf="' + gi + '"]').value.trim();
    const qv = m.querySelector('[data-nq="' + gi + '"]').value.trim();
    if (!fl) return toast(L('Впишите название вкуса'), true);
    const h = g.head;
    const { error } = await sb.from('products').upsert([{
      id: g.id, city: cityNow, flavor: fl, name: h.name, brand: h.brand, category: h.category,
      // новый вкус наследует ярлык и ступени товара, иначе строки одного товара разъедутся
      nic: h.nic, price: h.price, cost: h.cost, tiers: h.tiers || null, labels: h.labels || [],
      qty: +qv || 0, updated_at: new Date().toISOString()
    }], { onConflict: 'id,city,flavor' });
    if (error) return toast(productsErr(error), true);
    toast(L('Вкус добавлен')); clearDirty(); render();
  });
  const add = document.getElementById('np_add');
  if (add) add.onclick = async () => {
    const id = document.getElementById('np_id').value.trim();
    if (!id) return toast(L('Нужен id товара'), true);
    const price = moneyIn(document.getElementById('np_price').value);
    if (Number.isNaN(price)) return toast(L('Цена указана неверно'), true);
    const { error } = await sb.from('products').upsert([{
      id, city: cityNow, flavor: document.getElementById('np_flavor').value.trim(),
      name: document.getElementById('np_name').value.trim() || id,
      category: document.getElementById('np_cat').value.trim() || null,
      price,
      qty: +document.getElementById('np_qty').value || 0,
      updated_at: new Date().toISOString()
    }], { onConflict: 'id,city,flavor' });
    if (error) return toast(error.message, true);
    toast(L('Товар добавлен')); clearDirty(); render();
  };
}

async function saveProducts() {
  prodScroll = window.scrollY;
  const btn = document.getElementById('sb-apply');
  // сохраняем ровно то, что панель посчитала изменённым, чтобы счётчик и запись
  // не расходились между собой
  const changed = changedItems();
  const broken = changed.find(x => x.bad);
  if (broken) return toast(L('Цена у «') + (broken.name || broken.g.id) + L('» не число'), true);
  const out = [];
  changed.forEach(x => x.rows.forEach(({ r, qty }) => out.push({
    id: r.id, city: r.city, flavor: r.flavor, name: x.name || r.id,
    brand: x.brand || null, category: x.category || null, nic: x.nic || null,
    price: x.price, cost: x.cost, tiers: x.tiers, labels: x.labels,
    qty: Number.isFinite(qty) ? qty : 0, updated_at: new Date().toISOString()
  })));
  if (!out.length) { clearDirty(); return toast(L('Изменений нет')); }
  btn.disabled = true; btn.textContent = L('Сохраняем…');
  const { error } = await sb.from('products').upsert(out, { onConflict: 'id,city,flavor' });
  btn.disabled = false; btn.textContent = L('Применить');
  if (error) return toast(productsErr(error), true);
  toast(L('Сохранено: ') + out.length);
  clearDirty();
  render();
}

/* ================= старт ================= */
// Telegram возвращает подписанные данные в якоре адреса: #tgAuthResult=<base64 json>.
// Забираем их до всего остального и сразу меняем на сессию.
async function tgAuthFromHash() {
  const m = /tgAuthResult=([A-Za-z0-9_\-=]+)/.exec(location.hash || '');
  if (!m) return false;
  history.replaceState(null, '', location.pathname);   // не оставляем данные в адресе
  try {
    const json = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    await exchangeTg({ mode: 'widget', payload: JSON.parse(json) });
    await afterLogin();
    return true;
  } catch (e) {
    authView((e && e.message) || L('ошибка входа'));
    return true;
  }
}

// Отпечаток этой сборки, его проставляет npm run stamp.
const BUILD = 'bf5e1ad9';

// Браузер держит саму страницу панели в кеше, и человек видит вчерашний интерфейс, считая,
// что правки не приехали. Отпечаток рядом лежащего version.json читается мимо кеша: разошлось
// с нашим, значит копия старая. Перезагружаемся один раз, метка в sessionStorage не даёт
// зациклиться, если version.json почему-то новее навсегда.
async function checkBuild() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { build } = await r.json();
    if (!build || !BUILD || build === BUILD) { sessionStorage.removeItem('kv_reloaded'); return; }
    if (sessionStorage.getItem('kv_reloaded')) return;
    sessionStorage.setItem('kv_reloaded', '1');
    location.reload();
  } catch (e) {
    // нет связи: работаем с тем, что уже загружено
  }
}

(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  checkBuild();
  if (await tgAuthFromHash()) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data: ov } = await sb.rpc('admin_overview');
    if (ov) return afterLogin();
    await sb.auth.signOut();
  }
  if (tg && tg.initData && await tgInitLogin()) return;
  authView();
})();
