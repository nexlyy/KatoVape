<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KatoVape · управление</title>
<link rel="icon" type="image/png" href="../../data/photos/cat.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --surface:#121821; --surface-2:#171f29; --field:#0e141b;
  --line:#212b36; --line-2:#2e3b48;
  --ink:#e9eff4; --ink-2:#b3c0cc; --muted:#7f8d9a;
  --accent:#5ff3d0; --accent-ink:#04120e; --accent-dim:rgba(95,243,208,.13);
  --ok:#4ade80; --warn:#f5b83d; --danger:#fb7185; --info:#67d9f5;
  --r:10px; --r-lg:14px;
  --z-nav:20; --z-bar:60; --z-toast:80;
  --t:170ms cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- элементы управления ---- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--ink);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:13px;
  transition:background var(--t),border-color var(--t),color var(--t),opacity var(--t)}
.btn:hover{background:#1d2733;border-color:#3a4957}
.btn:active{background:#161e28}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#77f7d9;border-color:#77f7d9}
.btn.primary:active{background:#4ee0be}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
input,textarea{background:var(--field);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;width:100%;transition:border-color var(--t),background var(--t)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:hover,textarea:hover{border-color:var(--line-2)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:#101821}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
select{background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;
  transition:border-color var(--t)}
select:hover{border-color:var(--line-2)}
select:focus{outline:none;border-color:var(--accent)}

/* ---- вход ---- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(380px,100%)}
.auth-mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-mark img{width:34px;height:34px;border-radius:9px}
.auth-mark b{font-size:16px;font-weight:600}
.auth-mark span{color:var(--muted);font-size:13px}
.auth h1{font-size:19px;font-weight:600;margin-bottom:6px}
.auth p.lead{color:var(--muted);font-size:13px;margin-bottom:20px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .btn.primary{justify-content:center;padding:11px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 14px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.tgwrap{display:flex;justify-content:center;min-height:40px}
.msg{border-radius:var(--r);padding:9px 12px;font-size:12.5px;line-height:1.45;margin-top:12px}
.msg.err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#ffa7b5}

/* ---- каркас ---- */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100dvh}
@media(max-width:820px){.shell{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;z-index:var(--z-nav)}
@media(max-width:820px){.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
@media(max-width:820px){.nav{flex-direction:row;overflow-x:auto;flex:none;padding:0 10px 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;color:var(--ink-2);
  padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:background var(--t),color var(--t)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--surface-2);border-radius:99px;padding:1px 7px}
.nav button.on .count{background:rgba(4,18,14,.25);color:var(--accent)}
@media(max-width:820px){.nav .count{margin-left:6px}}
.who{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
@media(max-width:820px){.who{display:none}}
.who-ava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
.who-ava img{width:100%;height:100%;object-fit:cover}
.who-name{flex:1;min-width:0}
.who-name b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-name span{font-size:11px;color:var(--muted)}
/* ссылка на инструкцию: тише разделов, но всегда на виду в боковой колонке */
.guide-link{display:block;margin:6px 10px 10px;padding:8px 11px;border-radius:9px;font-size:12.5px;
  color:var(--muted);border:1px dashed var(--line-2);transition:color var(--t),border-color var(--t)}
.guide-link:hover{color:var(--accent);border-color:var(--accent)}
.admlang{display:flex;gap:4px;padding:0 14px 10px}
.admlang button{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
.admlang button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
@media(max-width:820px){.admlang{padding:0 10px 10px}}

.main{min-width:0;padding:22px clamp(16px,3vw,28px) 96px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.head h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.head p{color:var(--muted);font-size:13px}

/* сводка одной плотной строкой, без витринных плиток */
.summary{display:flex;flex-wrap:wrap;gap:2px 26px;padding:14px 0 18px;margin-bottom:18px;
  border-bottom:1px solid var(--line)}
.summary div{display:flex;align-items:baseline;gap:7px}
.summary b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.summary span{font-size:12.5px;color:var(--muted)}
.summary div.hot b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.panel + .panel{margin-top:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:14px;font-weight:600}
.panel-body{padding:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:auto}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--t)}
tbody tr:hover{background:var(--surface-2)}
td .sub{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.new{background:rgba(245,184,61,.14);color:var(--warn)}
.pill.ok{background:rgba(74,222,128,.13);color:var(--ok)}
.pill.live{background:var(--accent-dim);color:var(--accent)}
.pill.off{background:var(--surface-2);color:var(--muted)}

.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:5px}
.skeleton{padding:16px;display:flex;flex-direction:column;gap:9px}
.skeleton i{display:block;height:13px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),#1f2937,var(--surface-2));
  background-size:200% 100%;animation:sk 1.1s linear infinite}
.skeleton i:nth-child(2){width:78%}.skeleton i:nth-child(3){width:88%}.skeleton i:nth-child(4){width:64%}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---- ассортимент ---- */
.item{border-bottom:1px solid var(--line);padding:14px 16px}
.item:last-of-type{border-bottom:none}
.item-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-top input{width:auto}
.i-name{flex:2;min-width:150px}.i-brand{flex:1;min-width:110px}.i-cat{flex:1;min-width:115px}
.i-nic{width:100px}.i-price{width:92px}.i-tier{width:58px}
.item-id{font-size:11.5px;color:var(--muted);margin:7px 0 2px;font-variant-numeric:tabular-nums}
.flavs{display:flex;flex-direction:column}
.flav{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.flav-n{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.flav input{width:76px;text-align:center}
.flav .unit{font-size:12px;color:var(--muted)}
.add-flav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add-flav input{width:auto}
.dirty input{border-color:var(--accent)}

/* панель несохранённых изменений */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bar);background:var(--surface);
  border-top:1px solid var(--line-2);padding:12px clamp(16px,3vw,28px);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 -12px 32px -18px rgba(0,0,0,.9);
  transform:translateY(110%);transition:transform var(--t)}
.savebar.show{transform:none}
.savebar b{font-size:13.5px;font-weight:600}
.savebar span{color:var(--muted);font-size:12.5px}
.savebar .grow{flex:1}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .savebar{transition:none}
}

.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pform-wide{grid-column:1 / -1}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:4px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-t{font-size:11.5px;font-weight:700}
.kpi-t.up{color:var(--ok)}.kpi-t.down{color:var(--danger)}.kpi-t.flat{color:var(--muted)}
.dash-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.dash-none{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.chart{width:100%;height:170px;display:block;overflow:visible}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-area{fill:var(--accent-dim);stroke:none}
.chart circle{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .grid-t{fill:var(--muted);font-size:9px;vector-effect:non-scaling-stroke}
.chart-bar{fill:var(--accent)}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{background:var(--field);border-radius:99px;height:8px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-v{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:140px;height:140px;flex-shrink:0;transform:rotate(-90deg)}
.donut .ring{fill:none;stroke-width:16}
.donut-legend{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:0}
.donut-legend li{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.donut-legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
@media(max-width:640px){.kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .bar-row{grid-template-columns:minmax(70px,1fr) 1.4fr auto}}
.promo-tag{color:var(--accent)}
.i-hit{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.i-hit input{width:auto;margin:0}
.bcphoto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.bcpreview{display:block;max-width:220px;max-height:150px;object-fit:cover;border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.bcpreview[hidden]{display:none}

/* ================= телефон: свой формат панели =================
   Разделы прячем за бургер, шапка липкая сверху, таблицы становятся карточками.
   Всё, что нажимают пальцем, не ниже 44px. */
.mtop{display:none}
.mscrim{display:none}

@media(max-width:700px){
  .mtop{position:sticky;top:0;z-index:calc(var(--z-nav) + 2);display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mburger{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;
    border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--surface-2)}
  .mtitle{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mlang{display:flex;gap:4px;padding:0;width:auto;flex:0 0 auto}
  .mlang button{min-width:40px;height:34px;border-radius:9px}

  .mscrim{display:block;position:fixed;inset:0;z-index:var(--z-nav);background:rgba(0,0,0,.5)}
  .mscrim[hidden]{display:none}

  .shell{grid-template-columns:1fr}
  /* меню-ящик выезжает слева и закрывается по выбору раздела или тапу по затемнению */
  .side{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);height:100dvh;z-index:calc(var(--z-nav) + 1);
    border-right:1px solid var(--line);background:var(--surface);
    transform:translateX(-102%);transition:transform var(--t);overflow-y:auto}
  body.menu-open .side{transform:none}
  .brand{padding:16px 16px 12px}
  .nav{flex-direction:column;padding:6px 10px;gap:2px;flex:1;overflow:visible}
  .nav button{width:100%;flex-direction:row;justify-content:flex-start;gap:10px;
    min-height:46px;padding:10px 12px;font-size:14px;border-radius:10px}
  .nav .count{margin-left:auto}
  .side .admlang{display:none}      /* язык живёт в верхней шапке */
  .who{display:flex}

  .main{padding:14px 12px 96px}
  .head h1{font-size:18px}
  .head p{font-size:12.5px;line-height:1.45}
  .summary{gap:6px 16px;padding:10px 0 12px;margin-bottom:12px}
  .panel-head,.panel-body{padding:12px}
  .tools{gap:8px}
  .tools input,.tools select,.tools textarea{width:100%;min-height:44px}
  .tools .btn{flex:1 0 46%;justify-content:center;min-height:44px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:8px 12px;font-size:12.5px}
  input,select,textarea{font-size:16px;min-height:44px}   /* 16px не даёт iOS зумить поле */

  /* таблица в узком экране читается только карточками */
  table,thead,tbody,tr,th,td{display:block}
  thead{display:none}
  .scroll{overflow:visible}
  tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface-2);overflow:hidden}
  td{border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
  td:last-child{border-bottom:none}
  td::before{content:attr(data-l);flex:0 0 38%;max-width:38%;color:var(--muted);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding-top:3px}
  td:empty{display:none}
  td .tools{width:100%}
  td .btn.sm{flex:1}

  .item{padding:12px}
  .item-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .item-top input{width:100%}
  .i-name,.item-top .btn.danger,.i-hit{grid-column:1 / -1}
  .i-nic,.i-price,.i-tier{width:100%}
  .item-top .btn.danger{justify-content:center}
  .flav{gap:8px;padding:10px 0}
  .flav input{width:72px}
  .add-flav input{flex:1 0 100%}
  .add-flav .btn{flex:1}
  .pform{grid-template-columns:1fr;gap:12px}

  /* полоса сохранения: у неё своя строка кнопок, поверх контента, но не поверх меню */
  .savebar{bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:var(--z-bar)}
  .savebar b{width:100%;font-size:12.5px}
  .savebar span{display:none}
  .savebar .btn{flex:1;justify-content:center}
  .toast{bottom:104px}
}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:var(--z-toast);
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;
  padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#2a0710}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:9px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../../shared/config.js?v=6fff6fa3"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CFG = window.KV_CONFIG || {};
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// единый формат даты во всей панели: DD-MM-YYYY, время рядом
const pad2 = n => String(n).padStart(2, '0');
const fdate = s => {
  try {
    const d = new Date(s);
    if (isNaN(d)) return s || '';
    return pad2(d.getDate()) + '-' + pad2(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  } catch (e) { return s; }
};
// дата без времени (бронь), из ISO YYYY-MM-DD без сдвига по часовому поясу
const fday = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') : '';

function authView(errText) {
  app.innerHTML = `
    <div class="auth"><div class="auth-box">
      <div class="auth-mark"><img src="../../data/photos/cat.png" alt=""><div>
        <b>KatoVape</b><span>${L('панель управления')}</span></div></div>
      <h1>${L('Вход для менеджеров')}</h1>
      <p class="lead">${L('Войдите аккаунтом магазина или через Telegram. Доступ открыт только тем, кому его выдали.')}</p>
      <form id="pwform">
        <label class="f">${L('Логин, почта или телефон')}
          <input id="ident" autocomplete="username" placeholder="manager"></label>
        <label class="f">${L('Пароль')}
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
        <button class="btn primary" type="submit" id="pwgo">${L('Войти')}</button>
      </form>
      <div class="sep">${L('или')}</div>
      <div class="tgwrap" id="tgwrap"></div>
      <div class="msg err" id="err" ${errText ? '' : 'hidden'}>${errText ? esc(errText) : ''}</div>
    </div></div>`;

  document.getElementById('pwform').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('pwgo');
    const ident = document.getElementById('ident').value.trim();
    const pw = document.getElementById('pw').value;
    if (!ident || !pw) return showErr(L('Заполните оба поля'));
    btn.disabled = true; btn.textContent = L('Проверяем…');
    try {
      // логин разрешает и пароль проверяет сервер, наружу почта менеджера не уходит
      const res = await fetch(CFG.FUNCTIONS_URL.replace(/\/$/, '') + '/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY },
        body: JSON.stringify({ identifier: ident, password: pw })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.access_token) throw new Error(L('Неверный логин или пароль'));
      const { error } = await sb.auth.setSession({ access_token: out.access_token, refresh_token: out.refresh_token });
      if (error) throw error;
      await afterLogin();
    } catch (e2) {
      btn.disabled = false; btn.textContent = L('Войти');
      showErr(e2.message || L('Не вышло войти'));
    }
  };

  if (CFG.TELEGRAM_BOT) {
    const s = document.createElement('script');
    s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.setAttribute('data-telegram-login', CFG.TELEGRAM_BOT);
    s.setAttribute('data-size', 'large');
    s.setAttribute('data-onauth', 'onTgAuth(user)');
    s.setAttribute('data-request-access', 'write');
    document.getElementById('tgwrap').appendChild(s);
  }
}
function showErr(text) {
  const box = document.getElementById('err');
  if (!box) return;
  box.textContent = text; box.hidden = false;
}

async function exchangeTg(body) {
  const res = await fetch(CFG.FUNCTIONS_URL.replace(/\/$/, '') + '/telegram-auth', {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.email || !out.otp) throw new Error(out.error || L('не удалось войти'));
  const { error } = await sb.auth.verifyOtp({ email: out.email, token: out.otp, type: 'magiclink' });
  if (error) throw error;
}
window.onTgAuth = async u => {
  try { await exchangeTg({ mode: 'widget', payload: u }); await afterLogin(); }
  catch (e) { authView(e.message || L('ошибка входа')); }
};

async function tgInitLogin() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return false;
  try { await exchangeTg({ mode: 'initdata', initData: tg.initData }); await afterLogin(); return true; }
  catch (e) { return false; }
}

async function afterLogin() {
  const { data: { user } } = await sb.auth.getUser();
  const { data: ov, error } = await sb.rpc('admin_overview');
  if (error || !ov) {
    await sb.auth.signOut();
    return authView(L('У этого аккаунта нет доступа в панель. Попросите владельца выдать его во вкладке «Доступ».'));
  }
  me = user; overview = ov;
  const { data: p } = await sb.from('profiles').select('display_name, username, avatar').eq('id', user.id).maybeSingle();
  profile = p || null;
  shell();
}

/* ================= каркас ================= */
const ROLE_RU = { owner: L('владелец'), dev: L('разработчик'), manager: L('менеджер') };
// подписи считаем на каждый рендер: иначе переключатель языка их не обновит
const canDash = () => !!(overview && ['owner', 'dev'].includes(overview.role));
const TABS = () => [
  ['dash', L('Дашборд'), null],
  ['orders', L('Заказы'), ov => ov.orders_new],
  ['reservations', L('Бронь'), ov => ov.res_active],
  ['products', L('Ассортимент'), null],
  ['customers', L('Клиенты'), null],
  ['demand', L('Спрос'), null],
  ['broadcast', L('Рассылка'), null],
  ['promo', L('Промокоды'), null],
  ['access', L('Доступ'), null]
];

function closeMenu() {
  document.body.classList.remove('menu-open');
  const sc = document.getElementById('mscrim'); if (sc) sc.hidden = true;
}

function shell() {
  const name = (profile && (profile.display_name || profile.username)) || L('менеджер');
  const av = profile && profile.avatar;
  const curTab = TABS().find(([k]) => k === tab);
  app.innerHTML = `
    <div class="mtop">
      <button class="mburger" id="mburger" aria-label="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b class="mtitle">${curTab ? curTab[1] : 'KatoVape'}</b>
      <div class="admlang mlang">
        ${ADM_LANGS.map(([l, lb]) => `<button data-lang="${l}" class="${l === admLang ? 'on' : ''}">${lb}</button>`).join('')}
      </div>
    </div>
    <div class="mscrim" id="mscrim" hidden></div>
    <div class="shell">
      <aside class="side">
        <div class="brand"><img src="../../data/photos/cat.png" alt=""><div>
          <b>KatoVape</b><span>${L('управление')}</span></div></div>
        <nav class="nav" id="nav">
          ${TABS().filter(([k]) => (k !== 'access' || (overview && overview.can_grant)) && (k !== 'dash' || canDash())).map(([k, label, badge]) => {
            const n = badge && overview ? badge(overview) : 0;
            return `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${label}
              ${n ? `<i class="count">${n}</i>` : ''}</button>`;
          }).join('')}
        </nav>
        <a class="guide-link" href="./guide.html" target="_blank" rel="noopener">${L('Как работать в панели')}</a>
        <div class="admlang">
          ${ADM_LANGS.map(([l, lb]) => `<button data-lang="${l}" class="${l === admLang ? 'on' : ''}">${lb}</button>`).join('')}
        </div>
        <div class="who">
          <div class="who-ava">${av ? `<img src="${esc(av)}" alt="">` : esc(name[0].toUpperCase())}</div>
          <div class="who-name"><b>${esc(name)}</b><span>${esc(L(ROLE_RU[overview && overview.role] || L('доступ выдан')))}${
            myCity() ? ' · ' + esc(CITY_LABEL[myCity()] || myCity()) : ''}</span></div>
          <button class="btn quiet sm" id="logout">${L('Выйти')}</button>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="savebar" id="savebar">
      <b id="sb-count">${L('Изменений нет')}</b>
      <span id="sb-note">${L('не сохранено')}</span>
      <div class="grow"></div>
      <button class="btn quiet" id="sb-reset">${L('Отменить')}</button>
      <button class="btn primary" id="sb-apply">${L('Применить')}</button>
    </div>`;
  document.getElementById('nav').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b || b.dataset.t === tab) { closeMenu(); return; }
    if (hasChanges() && !confirm(L('Есть несохранённые изменения в ассортименте. Уйти и потерять их?'))) return;
    closeMenu();
    clearDirty(); tab = b.dataset.t; shell();
  };
  // на телефоне разделы прячутся за бургер: экран узкий, список длинный
  const burger = document.getElementById('mburger');
  const scrim = document.getElementById('mscrim');
  if (burger) burger.onclick = () => {
    const open = document.body.classList.toggle('menu-open');
    scrim.hidden = !open;
  };
  if (scrim) scrim.onclick = closeMenu;
  document.querySelectorAll('.admlang').forEach(el => el.onclick = e => {
    const b = e.target.closest('[data-lang]');
    if (b) setAdmLang(b.dataset.lang);
  });
  document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); me = null; authView(); };
  document.getElementById('sb-reset').onclick = () => { clearDirty(); render(); };
  document.getElementById('sb-apply').onclick = saveProducts;
  render();
}

function loading() {
  return '<div class="panel"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div>';
}
function empty(title, text) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(text)}</div>`;
}
function panel(title, body, tools) {
  return `<div class="panel"><div class="panel-head"><h2>${esc(title)}</h2>
    ${tools ? `<div class="tools">${tools}</div>` : ''}</div>${body}</div>`;
}
function table(head, rows) {
  if (!rows.length) return '';
  // data-l дублирует заголовок столбца: на телефоне строка превращается в карточку,
  // и подпись показывается слева от значения (шапка таблицы там скрыта)
  return `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td data-l="${esc(String(head[i] || '').replace(/<[^>]*>/g, ''))}">${c == null ? '' : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// статусы: русский текст в словаре, перевод накладываем при выводе через L()
const ST = { new: [L('новый'), 'new'], confirmed: [L('подтверждён'), 'live'], done: [L('выдан'), 'ok'],
  cancelled: [L('отменён'), 'off'], active: [L('активна'), 'live'], notified: [L('напомнили'), 'live'],
  expired: [L('истекла'), 'off'], waiting: [L('ждёт'), 'new'] };
const pill = s => { const x = ST[s] || [s, '']; return `<span class="pill ${x[1]}">${esc(L(x[0]))}</span>`; };

function itemsStr(items) {
  return (items || []).map(i => typeof i === 'string' ? i
    : (i.name || i.id) + (i.flavor ? ' · ' + i.flavor : '') + ' ×' + (i.n || 1)).join(', ');
}

/* ================= вкладки ================= */
async function render() {
  const m = document.getElementById('main'); if (!m) return;
  const titles = { dash: [L('Дашборд'), L('Ключевые показатели, графики и аналитика.')],
    orders: [L('Заказы'), L('Подтверждайте и отмечайте выдачу — клиенту уходит уведомление в Telegram.')],
    reservations: [L('Бронь'), L('Отменённая или просроченная бронь возвращает товар в наличие сама.')],
    products: [L('Ассортимент'), L('Правки видны на витрине сразу после сохранения.')],
    customers: [L('Клиенты'), L('Те, кто заводил аккаунт в магазине.')],
    demand: [L('Спрос'), L('Что чаще всего смотрят и бронируют.')],
    broadcast: [L('Рассылка'), L('Сообщение уйдёт всем, кто общался с ботом.')],
    promo: [L('Промокоды'), L('Скидка применяется в корзине. Условия проверяет сервер.')],
    access: [L('Доступ'), L('Кто может открывать эту панель.')] };
  const [h, sub] = titles[tab] || ['', ''];
  m.innerHTML = `<div class="head"><h1>${h}</h1><p>${sub}</p></div>${summaryHTML()}${loading()}`;
  const slot = () => m.querySelector('.panel');

  try {
    if (tab === 'dash') { if (!canDash()) { tab = 'orders'; return shell(); } await renderDash(m); }
    else if (tab === 'orders') await renderOrders(m);
    else if (tab === 'reservations') await renderReservations(m);
    else if (tab === 'products') await renderProducts(m);
    else if (tab === 'customers') await renderCustomers(m);
    else if (tab === 'demand') await renderDemand(m);
    else if (tab === 'broadcast') await renderBroadcast(m);
    else if (tab === 'promo') await renderPromo(m);
    else if (tab === 'access') await renderAccess(m);
  } catch (e) {
    const s = slot(); if (s) s.outerHTML = panel(L('Ошибка'), `<div class="empty">${esc(e.message || e)}</div>`);
  }
}
function summaryHTML() {
  const o = overview || {};
  const row = (v, label, hot) => `<div class="${hot ? 'hot' : ''}"><b>${v == null ? 0 : v}</b><span>${label}</span></div>`;
  return `<div class="summary">
    ${row(o.orders_new, L('новых заказов'), o.orders_new > 0)}
    ${row(o.orders, L('заказов всего'))}
    ${row(o.res_active, L('активных броней'), o.res_active > 0)}
    ${row(o.waiting, L('ждут поступления'))}
    ${row(o.users, L('клиентов'))}
    ${row(o.bot_users, L('в боте'))}
    ${row(o.reviews, L('отзывов'))}
  </div>`;
}
function swap(m, html) { const p = m.querySelector('.panel'); if (p) p.outerHTML = html; }

async function refreshOverview() {
  const { data } = await sb.rpc('admin_overview');
  if (data) { overview = data; const s = document.querySelector('.summary'); if (s) s.outerHTML = summaryHTML(); }
}

async function renderOrders(m) {
  const { data } = await sb.from('orders').select('*').order('id', { ascending: false }).limit(200);
  const rows = (data || []).map(o => {
    const c = o.contact || {};
    const who = [c.name, c.phone, c.email, c.paczkomat ? L('пачкомат ') + c.paczkomat : ''].filter(Boolean).map(esc).join('<br>');
    const acts = o.status === 'new'
      ? btn('ost', o.id, 'confirmed', L('Подтвердить'), 'primary') + btn('ost', o.id, 'cancelled', L('Отказ'), 'danger')
      : o.status === 'confirmed'
        ? btn('ost', o.id, 'done', L('Выдан'), 'primary') + btn('ost', o.id, 'cancelled', L('Отказ'), 'danger') : '';
    return [`<span class="num">#${o.id}</span><span class="sub">${fdate(o.created_at)}</span>`,
      esc(itemsStr(o.items)) +
        `<span class="sub">${esc(CITY_LABEL[o.city] || o.city)} · ${esc(DELIV_LABEL[o.delivery] || o.delivery || '')}${o.address ? ' · ' + esc(o.address) : ''}</span>` +
        (o.comment ? `<span class="sub">${L('Комментарий')}: ${esc(o.comment)}</span>` : ''),
      who || '<span class="sub">' + L('нет данных') + '</span>',
      // сумма со скидкой сама по себе непонятна: показываем, каким кодом её сбили
      `<span class="num">${o.sum || 0} zł</span>` +
        (o.promo && o.promo.length
          ? `<span class="sub promo-tag">${esc(o.promo.join(', '))}${o.discount ? ' −' + o.discount + ' zł' : ''}</span>`
          : ''),
      pill(o.status), `<div class="tools">${acts}</div>`];
  });
  swap(m, panel(L('Все заказы'), rows.length
    ? table([L('Заказ'), L('Состав'), L('Клиент'), L('Сумма'), L('Статус'), ''], rows)
    : empty(L('Заказов пока нет'), L('Как только кто-то оформит заказ на витрине, он появится здесь.'))));
  bindStatus(m, 'ost', 'orders');
}

async function renderReservations(m) {
  const { data } = await sb.from('reservations').select('*').order('id', { ascending: false }).limit(300);
  const rows = (data || []).map(r => {
    const acts = r.kind === 'reserve' && (r.status === 'active' || r.status === 'notified')
      ? btn('rst', r.id, 'done', L('Выдана'), 'primary') + btn('rst', r.id, 'cancelled', L('Отмена'), 'danger') : '';
    return [`<span class="num">#${r.id}</span><span class="sub">${fdate(r.created_at)}</span>`,
      esc(r.product_name || r.product_id) + (r.flavor ? `<span class="sub">${esc(r.flavor)}</span>` : ''),
      esc(CITY_LABEL[r.city] || r.city),
      `<span class="num">${r.reserve_date ? fday(r.reserve_date) + (r.reserve_time ? ' ' + esc(r.reserve_time) : '') : '—'}</span>`,
      r.kind === 'reserve' ? L('бронь') : L('ждёт поступления'), pill(r.status),
      `<span class="num">${r.telegram_id || '—'}</span>`, `<div class="tools">${acts}</div>`];
  });
  swap(m, panel(L('Брони и заявки'), rows.length
    ? table([L('Бронь'), L('Товар'), L('Город'), L('Дата'), L('Тип'), L('Статус'), 'Telegram', ''], rows)
    : empty(L('Броней нет'), L('Здесь появятся брони с витрины и заявки «сообщить о поступлении».'))));
  bindStatus(m, 'rst', 'reservations');
}
function btn(kind, id, st, label, cls) {
  return `<button class="btn sm ${cls || ''}" data-${kind}="${st}" data-id="${id}">${label}</button>`;
}
function bindStatus(m, kind, tableName) {
  m.querySelectorAll('[data-' + kind + ']').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const patch = { status: b.dataset[kind === 'ost' ? 'ost' : 'rst'] };
    if (tableName === 'orders') patch.updated_at = new Date().toISOString();
    // select() возвращает изменённые строки: если RLS не пустила (чужой город), их будет ноль,
    // и молчаливого «обновлено» быть не должно
    const { data, error } = await sb.from(tableName).update(patch).eq('id', +b.dataset.id).select('id');
    if (error) { b.disabled = false; return toast(error.message, true); }
    if (!data || !data.length) { b.disabled = false; return toast(L('Строка недоступна для изменения'), true); }
    toast(L('Статус обновлён'));
    await refreshOverview();
    render();
  });
}

async function renderDemand(m) {
  const { data } = await sb.from('demand').select('*').order('n', { ascending: false }).limit(100);
  const rows = (data || []).map(d => [esc(d.product_id), esc(d.event), `<span class="num">${d.n}</span>`]);

async function renderBroadcast(m) {
  // Менеджеру города доступен только его город: политика базы не пропустит рассылку
  // с другим городом (и с пустым тоже). Владелец и разработчик могут выбрать «все города».
  if (myCity() && bcCity !== myCity()) bcCity = myCity();
  // Считаем ровно ту аудиторию, которой бот отправит: он шлёт всем, кто писал ему,
  // флаг opted_in не смотрит, а город берёт из рассылки.
  let q = sb.from('bot_users').select('telegram_id', { count: 'exact', head: true });
  if (bcCity) q = q.eq('city', bcCity);
  const { count } = await q;
  const { data: last } = await sb.from('broadcasts').select('*').order('id', { ascending: false }).limit(5);
  const bcPill = s => s === 'done' ? '<span class="pill ok">' + L('разослана') + '</span>'
    : s === 'sending' ? '<span class="pill live">' + L('отправляем') + '</span>'
    : '<span class="pill new">' + L('в очереди') + '</span>';
  const hist = (last || []).map(b => [`<span class="num">#${b.id}</span>`, esc((b.text || '').slice(0, 60)),
    b.city ? esc(CITY_LABEL[b.city] || b.city) : '<span class="sub">' + L('все') + '</span>',
    bcPill(b.status),
    `<span class="num">${b.sent || 0} / ${b.failed || 0}</span>`, `<span class="num">${b.sent_at ? fdate(b.sent_at) : '—'}</span>`]);
  swap(m, panel(L('Новая рассылка'), `<div class="panel-body">
      <textarea id="bctext" rows="4" placeholder="${L('Что написать подписчикам бота')}"></textarea>
      <label class="f" style="max-width:260px">${L('Кому')}<select id="bccity">
        ${myCity() ? '' : `<option value="" ${bcCity ? '' : 'selected'}>${L('всем городам')}</option>`}
        ${citiesAllowed().map(c => `<option value="${c}" ${c === bcCity ? 'selected' : ''}>${CITY_LABEL[c]}</option>`).join('')}
      </select></label>
      <div class="bcphoto">
        <label class="btn" for="bcfile">${L('Прикрепить фото')}</label>
        <input type="file" id="bcfile" accept="image/*" hidden>
        <span class="hint" id="bcphotoname" style="margin:0"></span>
        <button class="btn quiet sm" id="bcphotoclear" hidden>${L('Убрать фото')}</button>
      </div>
      <img id="bcpreview" class="bcpreview" alt="" hidden>
      <div class="tools" style="margin-top:12px">
        <button class="btn primary" id="bcsend" ${count ? '' : 'disabled'}>Отправить ${count || 0} подписчикам</button>
        <span class="hint" style="margin:0" id="bcres"></span>
      </div>
      <p class="hint">Получают только те, кто писал боту${bcCity ? L(' и выбрал этот город в боте') : ''}. Кому не доставилось, того бот сам исключит из списка.
      ${count ? '' : L('Подходящих подписчиков нет: попросите людей открыть бота и нажать «Старт».')}</p>
    </div>`) + (hist.length ? panel(L('Последние рассылки'), table(['#', L('Текст'), L('Город'), L('Статус'), L('Ушло / ошибок'), L('Когда')], hist)) : ''));

  // выбор города меняет и аудиторию, и число на кнопке — перерисовываем экран
  const bcc = document.getElementById('bccity');
  if (bcc) bcc.onchange = () => { bcCity = bcc.value; render(); };

  // фото сжимаем до 1280px: Telegram всё равно ужмёт, а хранить гигантские data:URL незачем
  const file = document.getElementById('bcfile');
  if (file) file.onchange = () => {
    const f = file.files && file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        bcPhoto = cv.toDataURL('image/jpeg', 0.85);
        const prev = document.getElementById('bcpreview');
        prev.src = bcPhoto; prev.hidden = false;
        document.getElementById('bcphotoname').textContent = f.name;
        document.getElementById('bcphotoclear').hidden = false;
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  const clr = document.getElementById('bcphotoclear');
  if (clr) clr.onclick = () => {
    bcPhoto = null; file.value = '';
    document.getElementById('bcpreview').hidden = true;
    document.getElementById('bcphotoname').textContent = '';
    clr.hidden = true;
  };
  const send = document.getElementById('bcsend');
  if (send) send.onclick = async () => {
    const text = document.getElementById('bctext').value.trim();
    if (!text) return toast(L('Сначала напишите текст'), true);
    send.disabled = true; send.textContent = L('Ставим в очередь…');
    const { data, error } = await sb.from('broadcasts')
      .insert({ text, author: me.id, photo: bcPhoto || null, city: bcCity || null }).select().single();
    if (error) { send.disabled = false; send.textContent = L('Отправить'); return toast(error.message, true); }
    document.getElementById('bcres').textContent = L('В очереди, бот разошлёт за минуту…');
    bcPhoto = null;
    watchBroadcast(data.id);
  };
}
// бот забирает рассылку из очереди, поэтому ждём и показываем реальный итог
async function watchBroadcast(id) {
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const { data } = await sb.from('broadcasts').select('status, sent, failed').eq('id', id).maybeSingle();
    if (!data) continue;
    const res = document.getElementById('bcres');
    if (data.status === 'done') {
      if (res) res.textContent = `Готово: доставлено ${data.sent}, не дошло ${data.failed}`;
      toast(L('Рассылка отправлена'));
      return render();
    }

/* ================= dashboard ================= */
// Owner and developer only. Every figure is aggregated by the database (dash_* functions),
// which also enforces the role: the tab being hidden is convenience, not the access control.
const DASH_RANGES = [
  ['today', 'Сегодня'], ['yesterday', 'Вчера'], ['7d', '7 дней'], ['30d', '30 дней'],
  ['quarter', 'Квартал'], ['year', 'Год'], ['all', 'Всё время']
];
let dashRange = localStorage.getItem('kv_dash_range') || '30d';
let dashCustom = { from: '', to: '' };

function dashBounds() {
  const now = new Date();
  const day = 86400000;
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  let from, to = now;
  if (dashRange === 'custom' && dashCustom.from && dashCustom.to) {
    from = new Date(dashCustom.from + 'T00:00:00');
    to = new Date(dashCustom.to + 'T23:59:59');
  } else if (dashRange === 'today') from = startOfDay(now);
  else if (dashRange === 'yesterday') { to = startOfDay(now); from = new Date(to - day); }
  else if (dashRange === '7d') from = new Date(now - 7 * day);
  else if (dashRange === 'quarter') from = new Date(now - 90 * day);
  else if (dashRange === 'year') from = new Date(now - 365 * day);
  else if (dashRange === 'all') from = new Date('2020-01-01');
  else from = new Date(now - 30 * day);
  const days = (to - from) / day;
  return { from: from.toISOString(), to: to.toISOString(), bucket: days > 120 ? 'month' : 'day' };
}

const nf = n => Number(n || 0).toLocaleString('pl-PL');
const money = n => nf(Math.round(Number(n || 0))) + ' zł';

// Growth against the previous window of the same length. Null when there is nothing to
// compare with, so an empty history does not render as a triumphant +100%.
function trend(now, prev) {
  const a = Number(now || 0), b = Number(prev || 0);
  if (!b) return a ? null : 0;
  return Math.round(((a - b) / b) * 100);
}
function trendHTML(t) {
  if (t == null) return '';
  const cls = t > 0 ? 'up' : t < 0 ? 'down' : 'flat';
  const sign = t > 0 ? '+' : '';
  return `<span class="kpi-t ${cls}">${sign}${t}%</span>`;
}
function kpi(label, value, extra) {
  return `<div class="kpi"><span class="kpi-l">${esc(label)}</span>
    <b class="kpi-v">${value}</b>${extra || ''}</div>`;
}

// Charts are hand-drawn SVG on purpose: the panel has no build step and no dependencies,
// and a chart library would be the single heaviest thing on the page.
// The database only returns buckets that have data, so a month with a single order came back
// as one point and the chart had nothing to draw. Empty days are filled with zeros here, which
// is also what makes a flat stretch visibly flat instead of absent.
function fillSeries(rows, fromISO, toISO, bucket, keys) {
  const byDate = {};
  for (const r of rows) byDate[String(r.bucket).slice(0, 10)] = r;
  const out = [];
  const cur = new Date(fromISO);
  const end = new Date(toISO);
  cur.setHours(12, 0, 0, 0);
  if (bucket === 'month') cur.setDate(1);
  let guard = 0;
  while (cur <= end && guard++ < 400) {
    const iso = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' +
      String(bucket === 'month' ? 1 : cur.getDate()).padStart(2, '0');
    const src = byDate[iso] || {};
    const row = { date: iso, label: dashLabel(iso, bucket) };
    for (const k of keys) row[k] = Number(src[k] || 0);
    out.push(row);
    if (bucket === 'month') cur.setMonth(cur.getMonth() + 1); else cur.setDate(cur.getDate() + 1);
  }
  return out;
}
// Dates are shown the way the shop writes them everywhere else: DD-MM-YYYY.
function dashLabel(iso, bucket) {
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return bucket === 'month' ? m + '-' + y : d + '-' + m + '-' + y;
}

function lineChart(rows, yKey, opts) {
  const o = opts || {};
  if (!rows.length) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  const vals = rows.map(r => Number(r[yKey] || 0));
  const max = Math.max(...vals, 1);
  const W = 600, H = 170, PL = 6, PR = 6, PT = 14, PB = 26;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  const fmt = v => o.money ? money(v) : nf(v);
  const grid = [0, 0.5, 1].map(f => {
    const y = PT + plotH * (1 - f);
    return `<line class="grid" x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}"></line>` +
      `<text class="grid-t" x="${PL}" y="${y - 3}">${fmt(Math.round(max * f))}</text>`;
  }).join('');

  // A single bucket has no line to draw, so it is shown as one column instead of a stray dot.
  if (rows.length === 1) {
    const h = Math.max(3, (vals[0] / max) * plotH);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${grid}
      <rect class="chart-bar" x="${W / 2 - 26}" y="${PT + plotH - h}" width="52" height="${h}"></rect>
      </svg><div class="chart-x"><span>${esc(rows[0].label)}</span><span>${fmt(vals[0])}</span></div>`;
  }

  const step = plotW / (rows.length - 1);
  const xy = i => [PL + step * i, PT + plotH - (vals[i] / max) * plotH];
  const line = rows.map((_, i) => xy(i).join(',')).join(' ');
  const area = `${PL},${PT + plotH} ${line} ${PL + step * (rows.length - 1)},${PT + plotH}`;
  // Dots only where something happened, otherwise a quiet month is a wall of circles.
  const dots = rows.map((r, i) => {
    if (!vals[i]) return '';
    const [x, y] = xy(i);
    return `<circle cx="${x}" cy="${y}" r="2.6"><title>${esc(r.label)}: ${fmt(vals[i])}</title></circle>`;
  }).join('');
  const mid = rows[Math.floor(rows.length / 2)];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${grid}
    <polygon class="chart-area" points="${area}"></polygon>
    <polyline class="chart-line" points="${line}"></polyline>${dots}</svg>
    <div class="chart-x"><span>${esc(rows[0].label)}</span><span>${esc(mid.label)}</span><span>${esc(rows[rows.length - 1].label)}</span></div>`;
}

function barChart(rows, labelKey, valueKey, opts) {
  const o = opts || {};
  if (!rows.length) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  const max = Math.max(...rows.map(r => Number(r[valueKey] || 0)), 1);
  return `<div class="bars">${rows.map(r => {
    const v = Number(r[valueKey] || 0);
    return `<div class="bar-row"><span class="bar-l">${esc(o.label ? o.label(r) : r[labelKey])}</span>
      <span class="bar-t"><i style="width:${Math.max(2, (v / max) * 100)}%"></i></span>
      <b class="bar-v">${o.money ? money(v) : nf(v)}</b></div>`;
  }).join('')}</div>`;
}
function donut(rows, labelKey, valueKey, colors) {
  const total = rows.reduce((s, r) => s + Number(r[valueKey] || 0), 0);
  if (!total) return `<p class="dash-none">${L('Нет данных за период')}</p>`;
  let acc = 0;
  const R = 54, C = 2 * Math.PI * R;
  const arcs = rows.map((r, i) => {
    const share = Number(r[valueKey] || 0) / total;
    const dash = `${(share * C).toFixed(2)} ${(C - share * C).toFixed(2)}`;
    const off = (-acc * C).toFixed(2);
    acc += share;
    return `<circle class="ring" r="${R}" cx="70" cy="70" stroke="${colors[i % colors.length]}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}"></circle>`;
  }).join('');
  const legend = rows.map((r, i) =>
    `<li><i style="background:${colors[i % colors.length]}"></i>${esc(r[labelKey])}
      <b>${nf(r[valueKey])}</b></li>`).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 140 140">${arcs}</svg>
    <ul class="donut-legend">${legend}</ul></div>`;
}

function grantErr(error) {

  if (s.includes('BAD_ROLE')) return L('Неизвестная роль');
  return s;
}

/* ================= ассортимент ================= */
let bcPhoto = null;   // картинка рассылки, data:URL
let bcCity = '';      // город рассылки, пусто = всем городам
let groups = [], cityNow = 'katowice';

// Изменения считаем сравнением полей с тем, что пришло из базы. Прежний список
// «грязных» строк врал: правка одного товара помечала все его вкусы, а возврат
// значения обратно флаг не снимал, и сохранение всё равно считало заново.
// оптовые ступени: цена за штуку при 3/5/10 шт (q=1 — базовая цена товара)
function tierP(tiers, q) { const t = (tiers || []).find(x => +x.q === q); return t && t.p != null ? t.p : ''; }
// Нормализованная подпись ступеней: «3:36|5:33|10:30». База отдаёт jsonb со своим порядком
// ключей ({"p":40,"q":1}), поэтому сравнивать JSON-строки нельзя — панель несохранённых
// правок из-за этого висела всегда, даже когда ничего не меняли.
function tiersKey(tiers) {
  if (!tiers || !tiers.length) return '';
  return [...tiers].map(x => Number(x.q) + ':' + Number(x.p))
    .sort((a, b) => parseInt(a) - parseInt(b)).join('|');
}
// Понятный текст вместо сырого ответа PostgREST. Чаще всего это не ошибка данных:
// после миграции, добавившей колонку, у API какое-то время живёт старый кеш схемы, и
// сохранение «Хита» падает, хотя в базе всё на месте.
function productsErr(error) {
  const m = String((error && error.message) || '');
  if ((error && error.code === 'PGRST204') || /schema cache/i.test(m))
    return L('База ещё не знает про это поле. Примените миграции и обновите схему API (Supabase → Settings → API → Reload schema), потом повторите.');
  if (/row-level security|permission denied/i.test(m))
    return L('Нет прав на этот товар: проверьте город, закреплённый за вашей ролью.');
  return m || L('Не удалось сохранить');
}
function buildTiers(base, t3, t5, t10) {
  const arr = [];
  const b = base == null ? null : Number(base);
  if (b != null && Number.isFinite(b)) arr.push({ q: 1, p: b });
  [[3, t3], [5, t5], [10, t10]].forEach(([q, v]) => { if (v !== '' && Number.isFinite(Number(v))) arr.push({ q, p: Number(v) }); });
  return arr.length > 1 ? arr : null;   // только база или пусто — ступеней нет
}
function changedItems() {
  const m = document.getElementById('main'); if (!m) return [];
  const out = [];
  groups.forEach((g, gi) => {
    const card = m.querySelector('.item[data-g="' + gi + '"]'); if (!card) return;
    const gv = k => card.querySelector('[data-p="' + k + '"]').value.trim();
    const name = gv('name'), brand = gv('brand'), category = gv('category'), nic = gv('nic');
    const priceRaw = gv('price');
    const price = priceRaw === '' ? null : Number(priceRaw);
    const hit = !!card.querySelector('[data-p="hit"]').checked;
    const tiers = buildTiers(price, gv('t3'), gv('t5'), gv('t10'));
    const tiersChanged = tiersKey(tiers) !== tiersKey(g.head.tiers);
    const headChanged = name !== (g.head.name || '') || brand !== (g.head.brand || '')
      || category !== (g.head.category || '') || nic !== (g.head.nic || '') || price !== g.head.price || tiersChanged || hit !== !!g.head.hit;
    const rows = [];
    g.items.forEach((r, ri) => {
      const row = card.querySelector('.flav[data-f="' + gi + ':' + ri + '"]'); if (!row) return;
      const qtyRaw = row.querySelector('[data-q]').value.trim();
      const qty = qtyRaw === '' ? 0 : Number(qtyRaw);
      row.classList.toggle('dirty', qty !== r.qty);
      if (headChanged || qty !== r.qty) rows.push({ r, qty });
    });
    card.classList.toggle('dirty', headChanged);
    if (rows.length) out.push({ g, name, brand, category, nic, price, tiers, hit, rows, bad: priceRaw !== '' && !Number.isFinite(price) });
  });
  return out;
}
function clearDirty() { updateSaveBar(); }
function updateSaveBar() {
  const bar = document.getElementById('savebar'); if (!bar) return;
  const n = changedItems().length;
  bar.classList.toggle('show', n > 0);
  const c = document.getElementById('sb-count');
  const note = document.getElementById('sb-note');
  if (c) c.textContent = n === 1 ? L('Изменён один товар') : L('Изменено товаров: ') + n;
  if (note) note.textContent = L('изменения ещё не сохранены');
}
function hasChanges() { return changedItems().length > 0; }
window.addEventListener('beforeunload', e => { if (hasChanges()) { e.preventDefault(); e.returnValue = ''; } });

async function renderProducts(m) {
  // менеджер не должен даже случайно открыть чужой город (RLS его всё равно не пустит)
  if (myCity() && cityNow !== myCity()) cityNow = myCity();
  const { data } = await sb.from('products').select('*').eq('city', cityNow).order('id').order('flavor');
  const rows = data || [];
  groups = []; const byId = {};
  rows.forEach(r => {
    if (!byId[r.id]) { byId[r.id] = { id: r.id, head: r, items: [] }; groups.push(byId[r.id]); }
    byId[r.id].items.push(r);
  });
  // Ярлык и оптовые ступени — свойства товара, а не отдельного вкуса: в базе они
  // продублированы по строкам. Если вкус завели отдельно (кнопкой «Добавить вкус» или
  // выгрузкой), его строка приходит без них, и первая строка группы врёт — галочка
  // «Хит» показывалась снятой у товара, где ярлык стоит. Считаем как витрина: хит есть,
  // если он есть хотя бы у одной строки.
  groups.forEach(g => {
    g.head = Object.assign({}, g.head, {
      hit: g.items.some(r => r.hit),
      tiers: (g.items.find(r => r.tiers && r.tiers.length) || {}).tiers || null
    });
  });
  // менеджеру показываем только его город, владельцу и разработчику — все
  const cities = citiesAllowed();
  const tools = cities.map(c => `<button class="btn sm ${c === cityNow ? 'primary' : ''}" data-city="${c}">${c}</button>`).join('') +
    `<input id="pq" placeholder="${L('Найти товар')}" style="width:190px">`;

  const body = groups.length ? groups.map((g, gi) => `
    <div class="item" data-g="${gi}" data-search="${esc(((g.head.name || '') + ' ' + g.id).toLowerCase())}">
      <div class="item-top">
        <input class="i-name" data-p="name" value="${esc(g.head.name || '')}" placeholder="${L('Название')}">
        <input class="i-brand" data-p="brand" value="${esc(g.head.brand || '')}" placeholder="${L('Бренд')}">
        <input class="i-cat" data-p="category" value="${esc(g.head.category || '')}" placeholder="${L('Категория')}">
        <input class="i-nic" data-p="nic" value="${esc(g.head.nic || '')}" placeholder="${L('Крепость')}">
        <input class="i-price" data-p="price" value="${g.head.price == null ? '' : g.head.price}" placeholder="${L('Цена zł')}" inputmode="numeric">
        <input class="i-tier" data-p="t3" value="${tierP(g.head.tiers, 3)}" placeholder="3шт" inputmode="numeric" title="Цена за штуку при 3 шт">
        <input class="i-tier" data-p="t5" value="${tierP(g.head.tiers, 5)}" placeholder="5шт" inputmode="numeric" title="Цена за штуку при 5 шт">
        <input class="i-tier" data-p="t10" value="${tierP(g.head.tiers, 10)}" placeholder="10шт" inputmode="numeric" title="Цена за штуку при 10 шт">
        <label class="i-hit"><input type="checkbox" data-p="hit" ${g.head.hit ? 'checked' : ''}> ${L('Хит')}</label>
        <button class="btn sm danger" data-delp="${gi}">${L('Удалить товар')}</button>
      </div>
      <div class="item-id">${esc(g.id)}</div>
      <div class="flavs">${g.items.map((r, ri) => `
        <div class="flav" data-f="${gi}:${ri}">
          <span class="flav-n">${esc(r.flavor || L('без вкуса'))}</span>
          <input data-q="1" value="${r.qty == null ? 0 : r.qty}" inputmode="numeric">
          <span class="unit">шт</span>
          <button class="btn sm danger" data-delf="${gi}:${ri}" title="Удалить вкус">×</button>
        </div>`).join('')}</div>
      <div class="add-flav">
        <input data-nf="${gi}" placeholder="${L('Новый вкус')}" style="width:180px">
        <input data-nq="${gi}" placeholder="${L('шт')}" style="width:74px" inputmode="numeric">
        <button class="btn sm" data-addf="${gi}">${L('Добавить вкус')}</button>
      </div>
    </div>`).join('') : empty(L('В этом городе пусто'), L('Добавьте первый товар формой ниже.'));

  swap(m, panel(L('Товары · ') + cityNow, body, tools) + panel(L('Новый товар'), `<div class="panel-body">
      <div class="tools">
        <input id="np_id" placeholder="id, например hqd" style="width:150px">
        <input id="np_name" placeholder="${L('Название')}" style="width:170px">
        <input id="np_cat" placeholder="${L('Категория')}" style="width:140px">
        <input id="np_flavor" placeholder="Вкус (можно пусто)" style="width:170px">
        <input id="np_price" placeholder="${L('Цена')}" style="width:90px" inputmode="numeric">
        <input id="np_qty" placeholder="${L('шт')}" style="width:74px" inputmode="numeric">
        <button class="btn primary" id="np_add">${L('Добавить')}</button>
      </div>
      <p class="hint">${L('id должен совпадать с товаром на витрине, тогда наличие подтянется в карточку.')}</p>
    </div>`));

  bindProducts(m);
  updateSaveBar();

function bindProducts(m) {
  m.querySelectorAll('[data-city]').forEach(b => b.onclick = () => {
    if (hasChanges() && !confirm(L('Есть несохранённые изменения. Сменить город и потерять их?'))) return;
    clearDirty(); cityNow = b.dataset.city; render();
  });
  const pq = document.getElementById('pq');
  if (pq) pq.oninput = () => {
    const v = pq.value.trim().toLowerCase();
    m.querySelectorAll('.item').forEach(it => {
      it.style.display = !v || it.dataset.search.indexOf(v) >= 0 ? '' : 'none';
    });
  };
  // пересчитываем при каждом вводе: вернул значение обратно — панель сама уходит
  m.querySelectorAll('.item').forEach(card => {
    card.addEventListener('change', e => { if (e.target.dataset.p === 'hit') updateSaveBar(); });
    card.addEventListener('input', e => {
      if (e.target.dataset.p === undefined && e.target.dataset.q === undefined) return;
      updateSaveBar();
    });
  });
  m.querySelectorAll('[data-delp]').forEach(b => b.onclick = async () => {
    const g = groups[+b.dataset.delp]; if (!g) return;
    if (!confirm(L('Удалить «') + (g.head.name || g.id) + L('» со всеми вкусами?'))) return;
    const { error } = await sb.from('products').delete().match({ id: g.id, city: cityNow });
    if (error) return toast(error.message, true);
    toast(L('Товар удалён')); clearDirty(); render();
  });
  m.querySelectorAll('[data-delf]').forEach(b => b.onclick = async () => {
    const [gi, ri] = b.dataset.delf.split(':').map(Number);
    const r = groups[gi] && groups[gi].items[ri]; if (!r) return;
    if (!confirm(L('Удалить вкус «') + (r.flavor || L('без вкуса')) + '»?')) return;
    const { error } = await sb.from('products').delete().match({ id: r.id, city: r.city, flavor: r.flavor });
    if (error) return toast(error.message, true);
    toast(L('Вкус удалён')); clearDirty(); render();
  });
  m.querySelectorAll('[data-addf]').forEach(b => b.onclick = async () => {
    const gi = +b.dataset.addf, g = groups[gi]; if (!g) return;
    const fl = m.querySelector('[data-nf="' + gi + '"]').value.trim();
    const qv = m.querySelector('[data-nq="' + gi + '"]').value.trim();
    if (!fl) return toast(L('Впишите название вкуса'), true);
    const h = g.head;
    const { error } = await sb.from('products').upsert([{
      id: g.id, city: cityNow, flavor: fl, name: h.name, brand: h.brand, category: h.category,
      // новый вкус наследует ярлык и ступени товара, иначе строки одного товара разъедутся
      nic: h.nic, price: h.price, tiers: h.tiers || null, hit: !!h.hit,
      qty: +qv || 0, updated_at: new Date().toISOString()
    }], { onConflict: 'id,city,flavor' });
    if (error) return toast(productsErr(error), true);
    toast(L('Вкус добавлен')); clearDirty(); render();
  });
  const add = document.getElementById('np_add');
  if (add) add.onclick = async () => {
    const id = document.getElementById('np_id').value.trim();
    if (!id) return toast(L('Нужен id товара'), true);
    const priceRaw = document.getElementById('np_price').value.trim();
    const { error } = await sb.from('products').upsert([{
      id, city: cityNow, flavor: document.getElementById('np_flavor').value.trim(),
      name: document.getElementById('np_name').value.trim() || id,
      category: document.getElementById('np_cat').value.trim() || null,
      price: priceRaw === '' ? null : Number(priceRaw),
      qty: +document.getElementById('np_qty').value || 0,
      updated_at: new Date().toISOString()
    }], { onConflict: 'id,city,flavor' });
    if (error) return toast(error.message, true);
    toast(L('Товар добавлен')); clearDirty(); render();
  };
}

async function saveProducts() {
  const btn = document.getElementById('sb-apply');
  // сохраняем ровно то, что панель посчитала изменённым, чтобы счётчик и запись
  // не расходились между собой
  const changed = changedItems();
  const broken = changed.find(x => x.bad);
  if (broken) return toast(L('Цена у «') + (broken.name || broken.g.id) + L('» не число'), true);
  const out = [];
  changed.forEach(x => x.rows.forEach(({ r, qty }) => out.push({
    id: r.id, city: r.city, flavor: r.flavor, name: x.name || r.id,
    brand: x.brand || null, category: x.category || null, nic: x.nic || null,
    price: x.price, tiers: x.tiers, hit: x.hit, qty: Number.isFinite(qty) ? qty : 0, updated_at: new Date().toISOString()
  })));
  if (!out.length) { clearDirty(); return toast(L('Изменений нет')); }
  btn.disabled = true; btn.textContent = L('Сохраняем…');
  const { error } = await sb.from('products').upsert(out, { onConflict: 'id,city,flavor' });
  btn.disabled = false; btn.textContent = L('Применить');
  if (error) return toast(productsErr(error), true);
  toast(L('Сохранено: ') + out.length);
  clearDirty();
  render();
}

/* ================= старт ================= */
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data: ov } = await sb.rpc('admin_overview');
    if (ov) return afterLogin();
    await sb.auth.signOut();
  }
  if (tg && tg.initData && await tgInitLogin()) return;
  authView();
})();
</script>
